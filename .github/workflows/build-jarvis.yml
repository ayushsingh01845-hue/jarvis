      - name: Generate Gradle wrapper
        run: |
          sudo apt-get update && sudo apt-get install -y gradle
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Point Gradle to the Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Accept SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Keep the APK as a download
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish Jarvis.apk in Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Jarvis.apk
          gh release delete latest --yes --cleanup-tag --repo "${{ github.repository }}" || true
          gh release create latest Jarvis.apk --repo "${{ github.repository }}" --title "Jarvis" --notes "Download Jarvis.apk and install it on your phone."
