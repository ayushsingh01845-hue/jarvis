          package com.jarvis.app.ui

          import androidx.compose.animation.fadeIn
          import androidx.compose.animation.fadeOut
          import androidx.compose.animation.core.tween
          import androidx.compose.animation.slideInHorizontally
          import androidx.compose.foundation.layout.Box
          import androidx.compose.foundation.layout.navigationBarsPadding
          import androidx.compose.foundation.layout.padding
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.LaunchedEffect
          import androidx.compose.runtime.collectAsState
          import androidx.compose.runtime.getValue
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.unit.dp
          import androidx.navigation.NavHostController
          import androidx.navigation.compose.NavHost
          import androidx.navigation.compose.composable
          import androidx.navigation.compose.currentBackStackEntryAsState
          import androidx.navigation.compose.rememberNavController
          import com.jarvis.app.JarvisViewModel
          import com.jarvis.app.wake.WakeBus

          private const val SPLASH = "splash"
          private const val HOME = "home"
          private const val CHAT = "chat"
          private const val FACE = "face"
          private const val TASKS = "tasks"
          private const val SKILLS = "skills"
          private const val SETTINGS = "settings"
          private const val PERMISSIONS = "permissions"

          /** All screens, the slide/fade between them, and the floating dock at the bottom. */
          @Composable
          fun AppNav(vm: JarvisViewModel) {
              val nav = rememberNavController()
              val entry by nav.currentBackStackEntryAsState()
              val route = entry?.destination?.route

              val dockSelected = when (route) {
                  HOME -> "HOME"
                  FACE -> "FACE"
                  TASKS -> "TASKS"
                  SKILLS -> "SKILLS"
                  else -> null
              }

              val prefs by vm.prefs.collectAsState()
              val ready = route != null && route != SPLASH

              // bring the "Hey Jarvis" listener back when the app opens
              LaunchedEffect(prefs.wakeWord) {
                  if (prefs.wakeWord) vm.resumeWake()
              }

              // "Hey Jarvis" was heard: open the chat and start listening
              LaunchedEffect(ready) {
                  if (ready) {
                      if (WakeBus.pending) {
                          WakeBus.pending = false
                          vm.startListening()
                          goTab(nav, CHAT)
                      }
                      WakeBus.events.collect {
                          if (WakeBus.pending) {
                              WakeBus.pending = false
                              vm.startListening()
                              goTab(nav, CHAT)
                          }
                      }
                  }
              }

              // the phone's own voice window, used when the built-in listener keeps failing
              val voiceLauncher = androidx.activity.compose.rememberLauncherForActivityResult(
                  androidx.activity.result.contract.ActivityResultContracts.StartActivityForResult()
              ) { result ->
                  val list = result.data?.getStringArrayListExtra(android.speech.RecognizerIntent.EXTRA_RESULTS)
                  vm.onSystemVoice(list?.toList() ?: emptyList())
              }
              LaunchedEffect(Unit) {
                  vm.systemVoice.collect { tag ->
                      val i = android.content.Intent(android.speech.RecognizerIntent.ACTION_RECOGNIZE_SPEECH)
                          .putExtra(android.speech.RecognizerIntent.EXTRA_LANGUAGE_MODEL, android.speech.RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                          .putExtra(android.speech.RecognizerIntent.EXTRA_LANGUAGE, tag)
                          .putExtra(android.speech.RecognizerIntent.EXTRA_MAX_RESULTS, 5)
                      try {
                          voiceLauncher.launch(i)
                      } catch (e: Exception) {
                          vm.onSystemVoice(emptyList())
                      }
                  }
              }

              JarvisBackground {
                  NavHost(
                      navController = nav,
                      startDestination = SPLASH,
                      enterTransition = { fadeIn(tween(240)) + slideInHorizontally(tween(240)) { it / 14 } },
                      exitTransition = { fadeOut(tween(160)) },
                      popEnterTransition = { fadeIn(tween(240)) },
                      popExitTransition = { fadeOut(tween(160)) }
                  ) {
                      composable(SPLASH) {
                          SplashScreen(onDone = {
                              nav.navigate(HOME) { popUpTo(SPLASH) { inclusive = true } }
                          })
                      }
                      composable(HOME) {
                          HomeScreen(
                              vm,
                              onMenu = { nav.navigate(SETTINGS) { launchSingleTop = true } },
                              onChat = { goTab(nav, CHAT) },
                              onPermissions = { nav.navigate(PERMISSIONS) { launchSingleTop = true } }
                          )
                      }
                      composable(CHAT) {
                          ChatScreen(
                              vm,
                              onBack = { goTab(nav, HOME) },
                              onPermissions = { nav.navigate(PERMISSIONS) { launchSingleTop = true } }
                          )
                      }
                      composable(FACE) {
                          FaceScreen(vm, onMenu = { nav.navigate(SETTINGS) { launchSingleTop = true } })
                      }
                      composable(TASKS) {
                          TasksScreen(vm, onMenu = { nav.navigate(SETTINGS) { launchSingleTop = true } })
                      }
                      composable(SKILLS) {
                          SkillsScreen(vm, onMenu = { nav.navigate(SETTINGS) { launchSingleTop = true } })
                      }
                      composable(SETTINGS) {
                          SettingsScreen(
                              vm,
                              onClose = { nav.popBackStack() },
                              onPermissions = { nav.navigate(PERMISSIONS) { launchSingleTop = true } }
                          )
                      }
                      composable(PERMISSIONS) {
                          PermissionsScreen(vm, onBack = { nav.popBackStack() })
                      }
                  }

                  if (dockSelected != null) {
                      Box(
                          Modifier
                              .align(Alignment.BottomCenter)
                              .navigationBarsPadding()
                              .padding(bottom = 14.dp)
                      ) {
                          Dock(selected = dockSelected, onSelect = { item ->
                              when (item) {
                                  "HOME" -> goTab(nav, HOME)
                                  "FACE" -> goTab(nav, FACE)
                                  "CHAT" -> goTab(nav, CHAT)
                                  "TASKS" -> goTab(nav, TASKS)
                                  "SKILLS" -> goTab(nav, SKILLS)
                              }
                          })
                      }
                  }
              }
          }

          /** Go to one of the four main tabs without piling up screens behind it. */
          private fun goTab(nav: NavHostController, route: String) {
              if (route == HOME) {
                  val back = nav.popBackStack(HOME, false)
                  if (!back) nav.navigate(HOME) { launchSingleTop = true }
                  return
              }
              nav.navigate(route) {
                  popUpTo(HOME) { inclusive = false }
                  launchSingleTop = true
              }
          }
