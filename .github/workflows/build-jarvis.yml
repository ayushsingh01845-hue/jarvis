          package com.jarvis.app.voice

          import android.content.Context
          import android.content.Intent
          import android.media.AudioManager
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer

          /**
           * Voice in. Wraps Android's built-in SpeechRecognizer (Hindi, English or both).
           * Everything here must be called from the main thread.
           */
          class Listener(private val ctx: Context) {

              var onPartial: (String) -> Unit = {}
              var onLevel: (Float) -> Unit = {}
              var onResult: (List<String>) -> Unit = {}
              var onError: (Int) -> Unit = {}

              private var recognizer: SpeechRecognizer? = null

              // The phone plays a "ding" when listening starts and stops. Keep the music stream quiet meanwhile.
              private val audio = ctx.getSystemService(Context.AUDIO_SERVICE) as AudioManager
              private val handler = Handler(Looper.getMainLooper())
              private var mutedStreams: List<Int> = emptyList()
              private var savedRinger = AudioManager.RINGER_MODE_NORMAL
              private val failsafe = Runnable { unmuteBeeps() }
              private val memory = ctx.getSharedPreferences("jarvis_audio", Context.MODE_PRIVATE)

              /** Music is always quiet-able. The ding of some phones plays on other streams, which needs Do Not Disturb access. */
              private fun muteBeeps() {
                  if (mutedStreams.isNotEmpty()) return
                  val nm = ctx.getSystemService(Context.NOTIFICATION_SERVICE) as android.app.NotificationManager
                  val streams = if (nm.isNotificationPolicyAccessGranted) {
                      listOf(AudioManager.STREAM_MUSIC, AudioManager.STREAM_NOTIFICATION, AudioManager.STREAM_SYSTEM)
                  } else {
                      listOf(AudioManager.STREAM_MUSIC)
                  }
                  savedRinger = audio.ringerMode
                  val done = ArrayList<Int>()
                  for (s in streams) {
                      try {
                          if (!audio.isStreamMute(s)) {
                              audio.adjustStreamVolume(s, AudioManager.ADJUST_MUTE, 0)
                              done.add(s)
                          }
                      } catch (e: Exception) {
                      }
                  }
                  mutedStreams = done
                  if (done.isNotEmpty()) {
                      // remember it on disk: if the app dies while listening, the next start puts the sound back
                      memory.edit().putString("muted", done.joinToString(",")).apply()
                      handler.postDelayed(failsafe, 10000)
                  }
              }

              private fun unmuteBeeps() {
                  handler.removeCallbacks(failsafe)
                  if (mutedStreams.isEmpty()) return
                  val list = mutedStreams
                  mutedStreams = emptyList()
                  for (s in list) {
                      try {
                          audio.adjustStreamVolume(s, AudioManager.ADJUST_UNMUTE, 0)
                      } catch (e: Exception) {
                      }
                  }
                  try {
                      if (audio.ringerMode != savedRinger) audio.ringerMode = savedRinger
                  } catch (e: Exception) {
                  }
                  memory.edit().remove("muted").apply()
              }

              companion object {
                  /** Called when the app starts: put back any sound that was left muted. */
                  fun restoreSound(ctx: Context) {
                      try {
                          val memory = ctx.getSharedPreferences("jarvis_audio", Context.MODE_PRIVATE)
                          val saved = memory.getString("muted", null) ?: return
                          val audio = ctx.getSystemService(Context.AUDIO_SERVICE) as AudioManager
                          for (part in saved.split(",")) {
                              val s = part.toIntOrNull() ?: continue
                              try {
                                  audio.adjustStreamVolume(s, AudioManager.ADJUST_UNMUTE, 0)
                              } catch (e: Exception) {
                              }
                          }
                          memory.edit().remove("muted").apply()
                      } catch (e: Exception) {
                      }
                  }
              }

              /** Prefer Google's own recognizer when the phone has it: some phone makers' default one keeps disconnecting. */
              private fun createRecognizer(): SpeechRecognizer {
                  val google = android.content.ComponentName(
                      "com.google.android.googlequicksearchbox",
                      "com.google.android.voicesearch.serviceapi.GoogleRecognitionService"
                  )
                  val installed = try {
                      ctx.packageManager.getServiceInfo(google, 0)
                      true
                  } catch (e: Exception) {
                      false
                  }
                  return if (installed) SpeechRecognizer.createSpeechRecognizer(ctx, google) else SpeechRecognizer.createSpeechRecognizer(ctx)
              }

              /** langTag: "hi-IN" or "en-IN". */
              fun start(langTag: String) {
                  destroy()
                  muteBeeps()
                  val r = createRecognizer()
                  r.setRecognitionListener(object : RecognitionListener {
                      override fun onReadyForSpeech(params: Bundle?) {}
                      override fun onBeginningOfSpeech() {}
                      override fun onBufferReceived(buffer: ByteArray?) {}
                      override fun onEndOfSpeech() {}
                      override fun onEvent(eventType: Int, params: Bundle?) {}

                      override fun onRmsChanged(rmsdB: Float) {
                          // roughly -2 (silence) to 10 (loud) -> 0..1
                          onLevel(((rmsdB + 2f) / 12f).coerceIn(0f, 1f))
                      }

                      override fun onPartialResults(partialResults: Bundle?) {
                          val list = partialResults?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                          if (!list.isNullOrEmpty()) onPartial(list[0])
                      }

                      override fun onResults(results: Bundle?) {
                          unmuteBeeps()
                          val list = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                          onResult(list?.toList() ?: emptyList())
                      }

                      override fun onError(error: Int) {
                          unmuteBeeps()
                          this@Listener.onError(error)
                      }
                  })
                  recognizer = r
                  val i = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE, langTag)
                      putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true)
                      putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 5)
                      // Hindi speakers mix in English words: let the recognizer know (Android 13 and newer)
                      if (langTag.startsWith("hi")) putExtra("android.speech.extra.ADDITIONAL_LANGUAGES", arrayOf("en-IN"))
                      // stop waiting sooner after you finish speaking
                      putExtra(RecognizerIntent.EXTRA_SPEECH_INPUT_COMPLETE_SILENCE_LENGTH_MILLIS, 1200L)
                      putExtra(RecognizerIntent.EXTRA_SPEECH_INPUT_POSSIBLY_COMPLETE_SILENCE_LENGTH_MILLIS, 1000L)
                      putExtra(RecognizerIntent.EXTRA_CALLING_PACKAGE, ctx.packageName)
                  }
                  r.startListening(i)
              }

              /** You finished talking: deliver what was heard. */
              fun finish() {
                  try {
                      recognizer?.stopListening()
                  } catch (e: Exception) {
                  }
              }

              fun destroy() {
                  unmuteBeeps()
                  try {
                      recognizer?.cancel()
                      recognizer?.destroy()
                  } catch (e: Exception) {
                  }
                  recognizer = null
              }
          }
