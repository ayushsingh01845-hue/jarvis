          package com.jarvis.app.wake

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import com.jarvis.app.MainActivity
          import com.jarvis.app.R
          import org.vosk.Model
          import org.vosk.Recognizer
          import org.vosk.android.RecognitionListener
          import org.vosk.android.SpeechService

          /**
           * Listens quietly for "Hey Jarvis" while the app is in the background.
           * It lets go of the microphone whenever the app itself is talking or listening.
           */
          class WakeService : Service() {

              private val main = Handler(Looper.getMainLooper())
              private var model: Model? = null
              private var speech: SpeechService? = null
              private var running = false
              private var cooldownUntil = 0L
              private var idleSince = 0L

              private val tick = object : Runnable {
                  override fun run() {
                      check()
                      main.postDelayed(this, 500)
                  }
              }

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  WakeBus.active = true
                  WakeBus.busyListener = { stopListening() }
                  try {
                      goForeground()
                  } catch (e: Exception) {
                      WakeBus.active = false
                      stopSelf()
                      return
                  }
                  Thread {
                      try {
                          val m = Model(WakeModel.dir(this).absolutePath)
                          main.post { model = m }
                      } catch (e: Throwable) {
                          main.post { stopSelf() }
                      }
                  }.start()
                  main.postDelayed(tick, 500)
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int = START_STICKY

              override fun onDestroy() {
                  main.removeCallbacks(tick)
                  WakeBus.busyListener = null
                  WakeBus.active = false
                  stopListening()
                  try {
                      model?.close()
                  } catch (e: Throwable) {
                  }
                  model = null
                  super.onDestroy()
              }

              // ---------------------------------------------------------------- the listening loop

              private fun check() {
                  val m = model ?: return
                  val now = System.currentTimeMillis()
                  if (WakeBus.busy || now < cooldownUntil) {
                      idleSince = 0L
                      if (running) stopListening()
                      return
                  }
                  if (idleSince == 0L) idleSince = now
                  // wait a moment after the app goes quiet, so Jarvis's own voice is not picked up
                  if (!running && now - idleSince > 1200) startListening(m)
              }

              private fun startListening(m: Model) {
                  try {
                      val rec = Recognizer(m, 16000f, GRAMMAR)
                      val s = SpeechService(rec, 16000f)
                      s.startListening(object : RecognitionListener {
                          override fun onPartialResult(hypothesis: String?) {
                              if (heard(hypothesis)) onWake()
                          }

                          override fun onResult(hypothesis: String?) {
                              if (heard(hypothesis)) onWake()
                          }

                          override fun onFinalResult(hypothesis: String?) {}

                          override fun onError(exception: Exception?) {
                              stopListening()
                              cooldownUntil = System.currentTimeMillis() + 5000
                          }

                          override fun onTimeout() {}
                      })
                      speech = s
                      running = true
                  } catch (e: Throwable) {
                      running = false
                      cooldownUntil = System.currentTimeMillis() + 5000
                  }
              }

              private fun stopListening() {
                  try {
                      speech?.stop()
                      speech?.shutdown()
                  } catch (e: Throwable) {
                  }
                  speech = null
                  running = false
              }

              private fun heard(h: String?): Boolean {
                  if (h == null) return false
                  val t = h.lowercase()
                  return t.contains("jarvis") || t.contains("jar vis") || t.contains("hey travis")
              }

              private fun onWake() {
                  stopListening()
                  cooldownUntil = System.currentTimeMillis() + 3000
                  WakeBus.pending = true
                  WakeBus.events.tryEmit(Unit)
                  val open = Intent(this, MainActivity::class.java)
                      .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_SINGLE_TOP or Intent.FLAG_ACTIVITY_REORDER_TO_FRONT)
                  try {
                      startActivity(open)
                  } catch (e: Exception) {
                  }
                  // Android may block opening the app from the background, so also leave a tap-to-talk notification.
                  try {
                      val pi = PendingIntent.getActivity(this, 1, open, PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT)
                      val n = Notification.Builder(this, CH_ALERT)
                          .setSmallIcon(R.drawable.ic_launcher)
                          .setContentTitle("Jarvis")
                          .setContentText("I heard you. Tap to talk.")
                          .setContentIntent(pi)
                          .setAutoCancel(true)
                          .build()
                      val nm = getSystemService(NotificationManager::class.java)
                      nm.notify(2, n)
                  } catch (e: Exception) {
                  }
              }

              // ---------------------------------------------------------------- the always-on notification

              private fun goForeground() {
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel(CH_LISTEN, "Wake word", NotificationManager.IMPORTANCE_LOW))
                  nm.createNotificationChannel(NotificationChannel(CH_ALERT, "Jarvis heard you", NotificationManager.IMPORTANCE_HIGH).apply {
                      setSound(null, null)          // no ding
                      enableVibration(false)
                  })
                  val pi = PendingIntent.getActivity(
                      this, 0, Intent(this, MainActivity::class.java),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  val n = Notification.Builder(this, CH_LISTEN)
                      .setSmallIcon(R.drawable.ic_launcher)
                      .setContentTitle("Jarvis is listening")
                      .setContentText("Say \"Hey Jarvis\"")
                      .setContentIntent(pi)
                      .setOngoing(true)
                      .build()
                  if (Build.VERSION.SDK_INT >= 30) {
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE)
                  } else {
                      startForeground(1, n)
                  }
              }

              companion object {
                  private const val CH_LISTEN = "wake_listen"
                  private const val CH_ALERT = "wake_alert_silent"
                  private const val GRAMMAR = "[\"hey jarvis\", \"jarvis\", \"hey travis\", \"[unk]\"]"
              }
          }
