          package com.jarvis.app

          /** The feelings the face can show. */
          enum class Mood { NEUTRAL, HAPPY, LAUGH, SAD, SURPRISED, ANGRY, LOVE, WINK, SLEEPY }

          object MoodRead {

              /** Gemini answers with a word like "laugh" or "sad". */
              fun fromKey(key: String): Mood? {
                  return when (key.trim().lowercase()) {
                      "neutral" -> Mood.NEUTRAL
                      "happy", "glad", "smile" -> Mood.HAPPY
                      "laugh", "laughing", "funny" -> Mood.LAUGH
                      "sad", "cry", "crying", "empathy" -> Mood.SAD
                      "surprised", "surprise", "wow" -> Mood.SURPRISED
                      "angry", "mad" -> Mood.ANGRY
                      "love", "loving", "heart" -> Mood.LOVE
                      "wink", "playful" -> Mood.WINK
                      "sleepy", "tired" -> Mood.SLEEPY
                      else -> null
                  }
              }

              private val laughWords = setOf("haha", "hahaha", "hehe", "lol", "lmao", "हाहा", "हंस", "हँस", "हंसी", "hasi", "mazak", "मज़ाक", "मजाक", "joke", "जोक", "funny")
              private val sadWords = setOf("रोना", "रोता", "रोती", "rona", "sad", "उदास", "udaas", "udas", "दुख", "dukh", "dard", "अकेला", "akela", "depressed", "cry", "crying")
              private val angryWords = setOf("गुस्सा", "gussa", "angry", "बकवास", "bakwas", "hate")
              private val loveWords = setOf("प्यार", "pyaar", "pyar", "love")
              private val surpriseWords = setOf("wow", "omg", "सच", "sach", "really")
              private val happyWords = setOf("thanks", "thankyou", "shukriya", "धन्यवाद", "शुक्रिया", "mast", "मस्त", "badhiya", "बढ़िया", "great", "awesome", "congratulations")
              private val sleepyWords = setOf("neend", "नींद", "sleepy", "सोना", "sona")

              private val emojiMoods: List<Pair<String, Mood>> = listOf(
                  "😂" to Mood.LAUGH, "🤣" to Mood.LAUGH, "😢" to Mood.SAD, "😭" to Mood.SAD, "😡" to Mood.ANGRY,
                  "😍" to Mood.LOVE, "❤" to Mood.LOVE, "😮" to Mood.SURPRISED, "😉" to Mood.WINK, "😊" to Mood.HAPPY
              )

              private val phraseMoods: List<Pair<String, Mood>> = listOf(
                  "ro raha" to Mood.SAD, "ro rahi" to Mood.SAD, "रो रहा" to Mood.SAD, "रो रही" to Mood.SAD, "रोने" to Mood.SAD,
                  "bura lag" to Mood.SAD, "बुरा लग" to Mood.SAD, "मर गया" to Mood.SAD, "mar gaya" to Mood.SAD,
                  "miss you" to Mood.LOVE, "i love" to Mood.LOVE, "love you" to Mood.LOVE,
                  "good night" to Mood.SLEEPY, "गुड नाइट" to Mood.SLEEPY,
                  "क्या बात" to Mood.SURPRISED, "kya baat" to Mood.SURPRISED
              )

              /** Guess how the user feels from what they said, so the face can react at once. */
              fun fromUser(text: String): Mood? {
                  val t = text.lowercase()
                  for (p in emojiMoods) if (t.contains(p.first)) return p.second
                  for (p in phraseMoods) if (t.contains(p.first)) return p.second
                  val words = t.split(Regex("[^\\p{L}\\p{M}\\p{N}]+")).filter { it.isNotEmpty() }.toSet()
                  fun any(s: Set<String>) = words.any { it in s }
                  return when {
                      any(laughWords) -> Mood.LAUGH
                      any(sadWords) -> Mood.SAD
                      any(angryWords) -> Mood.ANGRY
                      any(loveWords) -> Mood.LOVE
                      any(surpriseWords) -> Mood.SURPRISED
                      any(happyWords) -> Mood.HAPPY
                      any(sleepyWords) -> Mood.SLEEPY
                      else -> null
                  }
              }
          }
