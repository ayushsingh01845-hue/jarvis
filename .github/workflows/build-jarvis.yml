          package com.jarvis.app.ui

          import android.provider.Settings
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.darkColorScheme
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.CompositionLocalProvider
          import androidx.compose.runtime.remember
          import androidx.compose.runtime.staticCompositionLocalOf
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.TextStyle
          import androidx.compose.ui.text.font.Font
          import androidx.compose.ui.text.font.FontFamily
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.sp
          import com.jarvis.app.R

          /** The fixed colors of the design. Only the accent changes (see Accents). */
          object JC {
              val Bg = Color.Black
              val Ink = Color.White
              val Dim = Color(0xFF8A8A8A)
              val Rim = Color(0x29FFFFFF)       // white 16%
              val Glass = Color(0x0FFFFFFF)     // white 6%
              val OnAccent = Color(0xFF00131A)  // near-black text on accent buttons
              val Red = Color(0xFFE8332B)
          }

          data class AccentOption(val key: String, val color: Color)

          /** The glow colors you can pick in Settings. Only ONE is used at a time. */
          object Accents {
              val all = listOf(
                  AccentOption("cyan", Color(0xFF18E0FF)),
                  AccentOption("red", Color(0xFFE8332B)),
                  AccentOption("lime", Color(0xFF7CFF3C)),
                  AccentOption("orange", Color(0xFFFF9F1A)),
                  AccentOption("purple", Color(0xFFA45BFF)),
                  AccentOption("pink", Color(0xFFFF4FA3)),
                  AccentOption("gold", Color(0xFFFFC933))
              )

              fun byKey(key: String): AccentOption = all.firstOrNull { it.key == key } ?: all[0]
          }

          val LocalAccent = staticCompositionLocalOf { Accents.all[0].color }
          val LocalReduceMotion = staticCompositionLocalOf { false }

          /** The three fonts of the design. Hindi text falls back to the phone's Devanagari font. */
          val Anton = FontFamily(Font(R.font.anton, FontWeight.Normal))
          val Inter = FontFamily(
              Font(R.font.inter_regular, FontWeight.Normal),
              Font(R.font.inter_semibold, FontWeight.SemiBold)
          )
          val Mono = FontFamily(
              Font(R.font.space_mono_regular, FontWeight.Normal),
              Font(R.font.space_mono_bold, FontWeight.Bold)
          )

          object JT {
              val label = TextStyle(fontFamily = Mono, fontSize = 11.sp, letterSpacing = 2.sp)
              val tiny = TextStyle(fontFamily = Mono, fontSize = 10.sp, letterSpacing = 1.sp)
              val body = TextStyle(fontFamily = Inter, fontSize = 14.sp)
              val heading = TextStyle(fontFamily = Anton, fontSize = 34.sp, letterSpacing = 1.sp)
          }

          @Composable
          fun JarvisTheme(accentKey: String, content: @Composable () -> Unit) {
              val ctx = LocalContext.current
              val reduce = remember {
                  try {
                      Settings.Global.getFloat(ctx.contentResolver, Settings.Global.ANIMATOR_DURATION_SCALE, 1f) == 0f
                  } catch (e: Exception) {
                      false
                  }
              }
              val accent = Accents.byKey(accentKey).color
              MaterialTheme(
                  colorScheme = darkColorScheme(
                      primary = accent,
                      onPrimary = JC.OnAccent,
                      background = Color.Black,
                      surface = Color.Black,
                      onBackground = Color.White,
                      onSurface = Color.White
                  )
              ) {
                  CompositionLocalProvider(
                      LocalAccent provides accent,
                      LocalReduceMotion provides reduce
                  ) {
                      content()
                  }
              }
          }
