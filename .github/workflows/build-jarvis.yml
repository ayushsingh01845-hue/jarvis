          import kotlin.math.abs
          import kotlin.math.max
          import kotlin.math.sin

          /** A face that listens to you and shows how it feels: it laughs, cries, gets surprised and so on. */
          @Composable
          fun FaceScreen(vm: JarvisViewModel, onMenu: () -> Unit) {
              val prefs by vm.prefs.collectAsState()
              val orb by vm.orb.collectAsState()
              val mood by vm.mood.collectAsState()
              val level by vm.level.collectAsState()
              val partial by vm.partial.collectAsState()
              val messages by vm.messages.collectAsState()
              val hindi = prefs.language == "HINDI"
              val mic = rememberMicAction(vm)

              val lastReply = messages.lastOrNull { !it.fromUser }?.text ?: ""
              val caption = when {
                  orb == OrbState.LISTENING -> if (partial.isNotBlank()) partial else pick(hindi, "सुन रहा हूँ…", "LISTENING…")
                  orb == OrbState.THINKING -> pick(hindi, "सोच रहा हूँ…", "THINKING…")
                  lastReply.isNotBlank() -> lastReply
                  else -> pick(hindi, "मुझे छुएँ और बात करें", "TAP ME AND TALK")
              }

              Column(
                  Modifier
                      .fillMaxSize()
                      .statusBarsPadding()
                      .padding(start = 16.dp, end = 16.dp, top = 12.dp, bottom = 120.dp),
                  horizontalAlignment = Alignment.CenterHorizontally
              ) {
                  TopBar(pick(hindi, "चेहरा", "FACE"), mood.name, MenuIcon.HAMBURGER, onMenu)
                  Spacer(Modifier.weight(1f))
                  FaceView(mood = mood, orb = orb, level = level, modifier = Modifier.size(300.dp).pressable(onClick = mic))
                  Spacer(Modifier.height(18.dp))
                  Text(
                      caption,
                      color = Color.White,
                      fontFamily = Inter,
                      fontSize = 15.sp,
                      lineHeight = 21.sp,
                      textAlign = TextAlign.Center,
                      maxLines = 4,
                      modifier = Modifier.fillMaxWidth().padding(horizontal = 8.dp)
                  )
                  Spacer(Modifier.weight(1f))
              }
          }

          /** How the face is shaped for each feeling. */
          private data class Look(
              val eyeOpen: Float,
              val arc: Float,      // 1 = happy closed eyes (^ ^)
              val tilt: Float,     // + angry, - sad
              val smile: Float,    // + smile, - frown
              val open: Float,     // mouth open
              val cheek: Float,
              val heart: Float,
              val red: Float,
              val tears: Boolean = false,
              val wink: Boolean = false
          )

          private fun lookFor(m: Mood): Look = when (m) {
              Mood.NEUTRAL -> Look(1f, 0f, 0f, 0.25f, 0f, 0f, 0f, 0f)
              Mood.HAPPY -> Look(0.9f, 0f, 0f, 0.85f, 0f, 0.8f, 0f, 0f)
              Mood.LAUGH -> Look(1f, 1f, 0f, 1f, 0.9f, 1f, 0f, 0f)
              Mood.SAD -> Look(0.8f, 0f, -1f, -0.8f, 0f, 0f, 0f, 0f, tears = true)
              Mood.SURPRISED -> Look(1.3f, 0f, 0f, 0f, 0.75f, 0f, 0f, 0f)
              Mood.ANGRY -> Look(0.7f, 0f, 1f, -0.5f, 0.1f, 0f, 0f, 1f)
              Mood.LOVE -> Look(1f, 0f, 0f, 0.9f, 0f, 1f, 1f, 0f)
              Mood.WINK -> Look(1f, 0f, 0f, 0.9f, 0f, 0.6f, 0f, 0f, wink = true)
              Mood.SLEEPY -> Look(0.15f, 0f, 0f, 0.1f, 0f, 0f, 0f, 0f)
          }

          @Composable
          fun FaceView(mood: Mood, orb: OrbState, level: Float, modifier: Modifier = Modifier) {
              val accent = LocalAccent.current
              val reduce = LocalReduceMotion.current
              var time by remember { mutableFloatStateOf(0f) }
              val orbNow by rememberUpdatedState(orb)
              val levelNow by rememberUpdatedState(level)
              val moodNow by rememberUpdatedState(mood)

              LaunchedEffect(reduce) {
                  if (!reduce) {
                      var last = 0L
                      while (true) {
                          androidx.compose.runtime.withFrameNanos { now ->
                              if (last != 0L) time += ((now - last) / 1_000_000_000f).coerceAtMost(0.1f)
                              last = now
                          }
                      }
                  }
              }

              val look = lookFor(mood)
              val spec = tween<Float>(380)
              val eyeOpen by animateFloatAsState(look.eyeOpen, spec, label = "eyeOpen")
              val arc by animateFloatAsState(look.arc, spec, label = "arc")
              val tilt by animateFloatAsState(look.tilt, spec, label = "tilt")
              val smile by animateFloatAsState(look.smile, spec, label = "smile")
              val open by animateFloatAsState(look.open, spec, label = "open")
              val cheek by animateFloatAsState(look.cheek, spec, label = "cheek")
              val heart by animateFloatAsState(look.heart, spec, label = "heart")
              val red by animateFloatAsState(look.red, spec, label = "red")
              val wink = look.wink
              val tears = look.tears

              Canvas(modifier) {
                  val u = size.minDimension / 300f
                  val t = time
                  val st = orbNow
                  val lv = levelNow
                  val color = lerp(accent, JC.Red, red.coerceIn(0f, 1f))

                  val bounce = if (moodNow == Mood.LAUGH) sin(t * 16f) * 4f * u else 0f
                  val cx = size.width / 2f
                  val cy = size.height / 2f + bounce

                  // soft glow behind the face
                  drawCircle(
                      brush = Brush.radialGradient(
                          colors = listOf(color.copy(alpha = 0.20f), Color.Transparent),
                          center = Offset(cx, cy),
                          radius = 160f * u
                      ),
                      radius = 160f * u,
                      center = Offset(cx, cy)
                  )

                  // where the eyes look, and how wide they are
                  var lookX = 0f
                  var lookY = 0f
                  var wide = 1f
                  if (st == OrbState.LISTENING) {
                      lookY = -6f * u
                      wide = 1.12f
                  } else if (st == OrbState.THINKING) {
                      lookX = sin(t * 1.6f) * 14f * u
                      lookY = -4f * u
                  }
                  val phase = t % 4.2f
                  val blink = if (phase < 0.14f) abs(phase - 0.07f) / 0.07f else 1f

                  val eyeDX = 70f * u
                  val eyeBaseY = cy - 40f * u

                  for (side in intArrayOf(-1, 1)) {
                      val ex = cx + side * eyeDX + lookX
                      val ey = eyeBaseY + lookY
                      val winking = wink && side == -1
                      val arcEff = if (winking) 1f else arc
                      val wOval = (1f - heart) * (1f - arcEff)
                      val wArc = (1f - heart) * arcEff

                      if (wOval > 0.01f) {
                          val w = 46f * u
                          val h = max(5f * u, 64f * u * eyeOpen * wide * blink)
                          rotate(degrees = -side * tilt * 16f, pivot = Offset(ex, ey)) {
                              drawRoundRect(
                                  color = color.copy(alpha = 0.18f * wOval),
                                  topLeft = Offset(ex - w / 2f - 7f * u, ey - h / 2f - 7f * u),
                                  size = Size(w + 14f * u, h + 14f * u),
                                  cornerRadius = CornerRadius((w + 14f * u) / 2f)
                              )
                              drawRoundRect(
                                  color = color.copy(alpha = wOval),
                                  topLeft = Offset(ex - w / 2f, ey - h / 2f),
                                  size = Size(w, h),
                                  cornerRadius = CornerRadius(w / 2f)
                              )
                          }
                      }
                      if (wArc > 0.01f) {
                          drawArc(
                              color = color.copy(alpha = wArc),
                              startAngle = 200f,
                              sweepAngle = 140f,
                              useCenter = false,
                              topLeft = Offset(ex - 26f * u, ey - 10f * u),
                              size = Size(52f * u, 52f * u),
                              style = Stroke(width = 11f * u, cap = StrokeCap.Round)
                          )
                      }
                      if (heart > 0.01f) {
                          val s = 34f * u * (1f + 0.12f * sin(t * 6f))
                          val p = Path().apply {
                              moveTo(ex, ey + s * 0.55f)
                              cubicTo(ex - s * 1.1f, ey - s * 0.05f, ex - s * 0.7f, ey - s * 0.95f, ex, ey - s * 0.4f)
                              cubicTo(ex + s * 0.7f, ey - s * 0.95f, ex + s * 1.1f, ey - s * 0.05f, ex, ey + s * 0.55f)
                              close()
                          }
                          drawPath(p, color.copy(alpha = heart))
                      }

                      // cheeks
                      if (cheek > 0.01f) {
                          drawCircle(color.copy(alpha = 0.22f * cheek), 24f * u, Offset(cx + side * 112f * u, cy + 42f * u))
                      }

                      // tears
                      if (tears) {
                          val ph = (t * 0.7f + (if (side < 0) 0f else 0.5f)) % 1f
                          drawCircle(
                              Color.White.copy(alpha = (1f - ph) * 0.8f),
                              6f * u,
                              Offset(ex + side * 14f * u, ey + 34f * u + ph * 80f * u)
                          )
                      }
                  }

                  // mouth
                  var openEff = open
                  var smileEff = smile
                  if (st == OrbState.SPEAKING) {
                      openEff = max(open, 0.08f) + 0.45f * (0.5f + 0.5f * sin(t * 13f))
                      if (smileEff < 0.2f) smileEff = 0.2f
                  } else if (st == OrbState.LISTENING) {
                      openEff = max(open, 0.04f + lv * 0.3f)
                  }
                  val my = cy + 78f * u
                  val mw = 112f * u * (1f - 0.25f * openEff)
                  val left = cx - mw / 2f
                  val right = cx + mw / 2f
                  val ctrlTop = my + smileEff * 44f * u
                  if (openEff > 0.08f) {
                      val full = Path().apply {
                          moveTo(left, my)
                          quadraticBezierTo(cx, ctrlTop, right, my)
                          quadraticBezierTo(cx, ctrlTop + openEff * 120f * u, left, my)
                          close()
                      }
                      drawPath(full, color.copy(alpha = 0.92f))
                      drawPath(full, color, style = Stroke(width = 6f * u, join = StrokeJoin.Round))
                  } else {
                      val line = Path().apply {
                          moveTo(left, my)
                          quadraticBezierTo(cx, ctrlTop, right, my)
                      }
                      drawPath(line, color, style = Stroke(width = 9f * u, cap = StrokeCap.Round))
                  }
              }
          }
