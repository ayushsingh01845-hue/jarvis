              Box(
                  Modifier
                      .size(78.dp)
                      .graphicsLayer {
                          scaleX = scale
                          scaleY = scale
                      }
                      .drawBehind {
                          drawCircle(
                              Brush.radialGradient(
                                  listOf(accent.copy(alpha = 0.45f), Color.Transparent),
                                  center = center,
                                  radius = size.minDimension * 0.75f
                              ),
                              radius = size.minDimension * 0.75f
                          )
                      }
                      .padding(6.dp)
                      .clip(CircleShape)
                      .background(
                          Brush.radialGradient(listOf(accent.copy(alpha = 0.95f), accent.copy(alpha = 0.55f))),
                          CircleShape
                      )
                      .border(1.dp, JC.Rim, CircleShape)
                      .pressable(onClick = onClick),
                  contentAlignment = Alignment.Center
              ) {
                  Canvas(Modifier.size(30.dp)) {
                      val c = JC.OnAccent
                      val sw = 2.5.dp.toPx()
                      if (listening) {
                          drawRoundRect(c, Offset(size.width * 0.2f, size.height * 0.2f), Size(size.width * 0.6f, size.height * 0.6f), CornerRadius(4.dp.toPx()))
                      } else {
                          drawRoundRect(c, Offset(size.width * 0.36f, size.height * 0.04f), Size(size.width * 0.28f, size.height * 0.5f), CornerRadius(size.width * 0.14f))
                          drawArc(
                              c, 0f, 180f, false,
                              topLeft = Offset(size.width * 0.22f, size.height * 0.26f),
                              size = Size(size.width * 0.56f, size.height * 0.46f),
                              style = Stroke(sw, cap = StrokeCap.Round)
                          )
                          drawLine(c, Offset(size.width * 0.5f, size.height * 0.72f), Offset(size.width * 0.5f, size.height * 0.92f), sw, StrokeCap.Round)
                          drawLine(c, Offset(size.width * 0.34f, size.height * 0.92f), Offset(size.width * 0.66f, size.height * 0.92f), sw, StrokeCap.Round)
                      }
                  }
              }
          }

          /** One chat bubble (pops in with a small spring). */
          @Composable
          fun Bubble(m: ChatMessage, onCardTap: (CardTap) -> Unit) {
              val accent = LocalAccent.current
              val pop = remember { Animatable(0.88f) }
              LaunchedEffect(m.id) {
                  pop.animateTo(1f, spring(dampingRatio = Spring.DampingRatioMediumBouncy, stiffness = Spring.StiffnessMedium))
              }
              val shape = if (m.fromUser) {
                  RoundedCornerShape(topStart = 22.dp, topEnd = 22.dp, bottomEnd = 6.dp, bottomStart = 22.dp)
              } else {
                  RoundedCornerShape(topStart = 22.dp, topEnd = 22.dp, bottomEnd = 22.dp, bottomStart = 6.dp)
              }
              Box(
                  Modifier
                      .fillMaxWidth()
                      .graphicsLayer {
                          scaleX = pop.value
                          scaleY = pop.value
                          alpha = ((pop.value - 0.88f) / 0.12f).coerceIn(0f, 1f)
                      },
                  contentAlignment = if (m.fromUser) Alignment.CenterEnd else Alignment.CenterStart
              ) {
                  if (m.fromUser) {
                      Text(
                          m.text,
                          color = Color(0xFF001018),
                          fontFamily = Inter,
                          fontSize = 14.sp,
                          modifier = Modifier
                              .widthIn(max = 300.dp)
                              .clip(shape)
                              .background(Brush.horizontalGradient(listOf(accent.copy(alpha = 0.9f), accent.copy(alpha = 0.6f))), shape)
                              .padding(horizontal = 16.dp, vertical = 11.dp)
                      )
                  } else {
                      Column(
                          Modifier
                              .widthIn(max = 320.dp)
                              .glass(shape)
                              .padding(horizontal = 16.dp, vertical = 11.dp),
                          verticalArrangement = Arrangement.spacedBy(6.dp)
                      ) {
                          Text(Brand.NAME, color = accent, style = JT.tiny)
                          Text(m.text, color = Color.White, fontFamily = Inter, fontSize = 14.sp, lineHeight = 20.sp)
                          val card = m.card
                          if (card != null) ActionCardView(card, onCardTap)
                      }
                  }
              }
          }

          /** The result box inside Jarvis's bubble: big word, small caption. */
          @Composable
          fun ActionCardView(card: ActionCard, onTap: (CardTap) -> Unit) {
              val accent = LocalAccent.current
              val shape = RoundedCornerShape(18.dp)
              Column(
                  Modifier
                      .fillMaxWidth()
                      .clip(shape)
                      .background(accent.copy(alpha = 0.08f), shape)
                      .border(1.dp, accent.copy(alpha = 0.5f), shape)
                      .then(if (card.tap != CardTap.NONE) Modifier.pressable { onTap(card.tap) } else Modifier)
