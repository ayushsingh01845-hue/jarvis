          package com.jarvis.app.brain

          import android.Manifest
          import android.app.Application
          import android.app.SearchManager
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.content.pm.ResolveInfo
          import android.hardware.camera2.CameraCharacteristics
          import android.hardware.camera2.CameraManager
          import android.media.AudioManager
          import android.net.Uri
          import android.os.BatteryManager
          import android.provider.AlarmClock
          import android.provider.ContactsContract.CommonDataKinds.Phone
          import android.provider.MediaStore
          import androidx.core.content.ContextCompat
          import com.jarvis.app.data.Prefs
          import com.jarvis.app.data.PrefsRepo
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import java.text.SimpleDateFormat
          import java.util.Calendar
          import java.util.Date
          import java.util.Locale

          /**
           * Does the real thing on the phone: alarm, timer, call, message, open app, torch, volume,
           * music, notes, search. Every action returns an Outcome (a spoken reply + a result card).
           */
          class ActionRunner(private val app: Application, private val repo: PrefsRepo) {

              private val ctx: Context get() = app

              suspend fun run(act: Act, l: RLang, p: Prefs): Outcome = withContext(Dispatchers.IO) {
                  val n = p.userName.ifBlank { "Ayush" }
                  if (skillOff(act, p)) {
                      return@withContext Outcome(
                          tr(
                              l,
                              "यह स्किल अभी बंद है। आप इसे Skills स्क्रीन में चालू कर सकते हैं।",
                              "Ye skill abhi band hai. Aap ise Skills screen me chalu kar sakte ho.",
                              "That skill is switched off. You can turn it on in Skills."
                          ),
                          ok = false
                      )
                  }
                  try {
                      when (act) {
                          is Act.Alarm -> alarm(act, l, n)
                          is Act.Timer -> timer(act, l, n)
                          is Act.Call -> call(act, l, p, n)
                          is Act.Sms -> sms(act, l, n)
                          is Act.OpenApp -> openApp(act, l)
                          is Act.Torch -> torch(act, l)
                          is Act.Volume -> volume(act, l)
                          is Act.Music -> music(act, l)
                          is Act.Note -> note(act, l, n)
                          is Act.WebSearch -> webSearch(act, l)
                          is Act.Info -> info(act, l)
                          is Act.Ask -> ask(act, l)
                          else -> Outcome()
                      }
                  } catch (e: Exception) {
                      Outcome(
                          tr(
                              l,
                              "यह काम नहीं हो पाया। (${e.javaClass.simpleName})",
                              "Ye kaam nahi ho paya. (${e.javaClass.simpleName})",
                              "I couldn't do that. (${e.javaClass.simpleName})"
                          ),
                          ok = false
                      )
                  }
              }

              /** Called 3 seconds after the "CALLING" card appears, if you did not cancel. */
              fun callNow(number: String): Boolean {
                  if (!has(Manifest.permission.CALL_PHONE)) return false
                  return start(Intent(Intent.ACTION_CALL, Uri.parse("tel:" + Uri.encode(number))))
              }

              // ------------------------------------------------------------------ helpers

              private fun skillOff(act: Act, p: Prefs): Boolean = when (act) {
                  is Act.Alarm, is Act.Timer -> !p.skillAlarms
                  is Act.Call, is Act.Sms -> !p.skillCalls
                  is Act.OpenApp -> !p.skillApps
                  is Act.Music -> !p.skillMusic
                  is Act.Torch, is Act.Volume -> !p.skillDevice
                  is Act.Note -> !p.skillNotes
                  is Act.WebSearch -> !p.skillWeb
                  else -> false
              }

              private fun has(permission: String): Boolean =
                  ContextCompat.checkSelfPermission(ctx, permission) == PackageManager.PERMISSION_GRANTED

              private fun start(intent: Intent): Boolean = try {
                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  ctx.startActivity(intent)
                  true
              } catch (e: Exception) {
                  false
              }

              private fun two(n: Int): String = n.toString().padStart(2, '0')

              private fun h12(h: Int): Int = if (h % 12 == 0) 12 else h % 12

              private fun speakTime(h: Int, m: Int, l: RLang): String {
                  val t = "${h12(h)}:${two(m)}"
                  return when (l) {
                      RLang.HI -> "$t बजे"
                      RLang.HING -> "$t baje"
                      RLang.EN -> t + if (h < 12) " AM" else " PM"
                  }
              }

              private fun durationWords(secs: Int, l: RLang): String {
                  val h = secs / 3600
                  val m = (secs % 3600) / 60
                  val s = secs % 60
                  val parts = ArrayList<String>()
                  if (h > 0) parts.add(tr(l, "$h घंटा", "$h ghanta", if (h == 1) "1 hour" else "$h hours"))
                  if (m > 0) parts.add(tr(l, "$m मिनट", "$m minute", if (m == 1) "1 minute" else "$m minutes"))
                  if (s > 0) parts.add(tr(l, "$s सेकंड", "$s second", if (s == 1) "1 second" else "$s seconds"))
                  return parts.joinToString(" ")
              }

              private fun clockText(secs: Int): String {
                  val h = secs / 3600
                  val m = (secs % 3600) / 60
                  val s = secs % 60
                  return if (h > 0) "$h:${two(m)}:${two(s)}" else "${two(m)}:${two(s)}"
              }

              private fun needContacts(l: RLang) = Outcome(
                  tr(
                      l,
                      "नाम खोजने के लिए मुझे Contacts की अनुमति चाहिए।",
                      "Naam dhundhne ke liye mujhe Contacts ki permission chahiye.",
                      "I need the Contacts permission to find that name."
                  ),
                  ActionCard("ALLOW", "CONTACTS", "Tap to open permissions", CardTap.PERMISSIONS),
                  ok = false
              )

              // ------------------------------------------------------------------ actions

              private fun alarm(a: Act.Alarm, l: RLang, n: String): Outcome {
                  val i = Intent(AlarmClock.ACTION_SET_ALARM).apply {
                      putExtra(AlarmClock.EXTRA_HOUR, a.hour)
                      putExtra(AlarmClock.EXTRA_MINUTES, a.minute)
                      if (a.label.isNotBlank()) putExtra(AlarmClock.EXTRA_MESSAGE, a.label)
                      putExtra(AlarmClock.EXTRA_SKIP_UI, true)
                  }
                  if (!start(i)) {
                      return Outcome(
                          tr(l, "मुझे अलार्म ऐप नहीं मिला।", "Mujhe alarm app nahi mila.", "I couldn't find an alarm app."),
                          ok = false
                      )
                  }
                  val spoken = speakTime(a.hour, a.minute, l)
                  return Outcome(
                      reply = tr(
                          l,
                          "ठीक है $n। $spoken का अलार्म लगा दिया।",
                          "Theek hai $n. $spoken ka alarm laga diya.",
                          "Done, $n. Alarm set for $spoken."
                      ),
                      card = ActionCard("${two(a.hour)}:${two(a.minute)}", "ALARM SET", if (a.label.isNotBlank()) a.label else "Repeats off")
                  )
              }

              private fun timer(a: Act.Timer, l: RLang, n: String): Outcome {
                  val secs = a.seconds.coerceIn(1, 86400)
                  val i = Intent(AlarmClock.ACTION_SET_TIMER).apply {
                      putExtra(AlarmClock.EXTRA_LENGTH, secs)
                      putExtra(AlarmClock.EXTRA_SKIP_UI, true)
                  }
                  if (!start(i)) {
                      return Outcome(
                          tr(l, "मुझे टाइमर ऐप नहीं मिला।", "Mujhe timer app nahi mila.", "I couldn't find a timer app."),
                          ok = false
                      )
                  }
                  val words = durationWords(secs, l)
                  return Outcome(
                      reply = tr(
                          l,
                          "ठीक है $n। $words का टाइमर शुरू कर दिया।",
                          "Theek hai $n. $words ka timer shuru kar diya.",
                          "Okay, $n. Timer started for $words."
                      ),
                      card = ActionCard(clockText(secs), "TIMER SET", words)
                  )
              }

              private fun dial(name: String, number: String, l: RLang, p: Prefs): Outcome {
                  val direct = p.callDirect && has(Manifest.permission.CALL_PHONE)
                  return if (direct) {
                      Outcome(
                          reply = tr(l, "$name को कॉल कर रहा हूँ…", "$name ko call kar raha hoon…", "Calling $name…"),
                          card = ActionCard("CALLING", name.uppercase(), "Tap to cancel", CardTap.CANCEL_CALL),
                          pendingCall = PendingCall(name, number)
                      )
                  } else {
                      val ok = start(Intent(Intent.ACTION_DIAL, Uri.parse("tel:" + Uri.encode(number))))
                      if (!ok) {
                          Outcome(
                              tr(l, "मुझे फ़ोन ऐप नहीं मिला।", "Mujhe phone app nahi mila.", "I couldn't find a phone app."),
                              ok = false
                          )
                      } else {
                          Outcome(
                              reply = tr(
                                  l,
                                  "$name का नंबर डायलर में खोल दिया। कॉल का बटन आप दबाइए।",
                                  "$name ka number dialer me khol diya. Call ka button aap dabao.",
                                  "I opened $name in the dialer. Press call when you're ready."
                              ),
                              card = ActionCard("DIAL", name.uppercase(), number)
                          )
                      }
                  }
              }

              private fun pickContact(query: String, l: RLang): Pair<Contacts.Contact?, Outcome?> {
                  val matches = Contacts.find(ctx, query)
                  if (matches.isEmpty()) {
                      return Pair(
                          null,
                          Outcome(
                              tr(
                                  l,
                                  "मुझे \"$query\" नाम का कोई कॉन्टैक्ट नहीं मिला।",
                                  "Mujhe \"$query\" naam ka koi contact nahi mila.",
                                  "I couldn't find a contact called \"$query\"."
                              ),
                              ok = false
                          )
                      )
                  }
                  val top = matches[0]
                  val tie = matches.filter { it.score == top.score && it.contact.id != top.contact.id }
                  if (tie.isNotEmpty()) {
                      val names = (listOf(top) + tie).take(3).joinToString(", ") { it.contact.name }
                      return Pair(
                          null,
                          Outcome(
                              tr(
                                  l,
                                  "कई नाम मिले: $names। पूरा नाम बोलिए।",
                                  "Kai naam mile: $names. Poora naam bolo.",
                                  "I found several: $names. Please say the full name."
                              ),
                              ok = false
                          )
                      )
                  }
                  return Pair(top.contact, null)
              }

              private fun call(a: Act.Call, l: RLang, p: Prefs, n: String): Outcome {
                  val digits = a.name.filter { it.isDigit() }
                  if (digits.length >= 5) return dial(digits, digits, l, p)
                  if (!has(Manifest.permission.READ_CONTACTS)) return needContacts(l)
                  val (contact, problem) = pickContact(a.name, l)
                  if (contact == null) return problem ?: Outcome(ok = false)
                  return dial(contact.name, contact.number, l, p)
              }

              private fun sms(a: Act.Sms, l: RLang, n: String): Outcome {
                  var number = ""
                  var shown = ""
                  if (a.name.isNotBlank()) {
                      val digits = a.name.filter { it.isDigit() }
                      if (digits.length >= 5) {
                          number = digits
                          shown = digits
                      } else {
                          if (!has(Manifest.permission.READ_CONTACTS)) return needContacts(l)
                          val (contact, problem) = pickContact(a.name, l)
                          if (contact == null) return problem ?: Outcome(ok = false)
                          number = contact.number
                          shown = contact.name
                      }
                  }
                  val i = Intent(Intent.ACTION_SENDTO, Uri.parse("smsto:" + Uri.encode(number))).apply {
                      if (a.text.isNotBlank()) putExtra("sms_body", a.text)
                  }
                  if (!start(i)) {
                      return Outcome(
                          tr(l, "मुझे मैसेज ऐप नहीं मिला।", "Mujhe messaging app nahi mila.", "I couldn't find a messaging app."),
                          ok = false
                      )
                  }
                  val who = if (shown.isBlank()) tr(l, "मैसेज", "message", "message") else shown
                  return Outcome(
                      reply = tr(
                          l,
                          "मैसेज तैयार है। भेजने का बटन आप दबाइए।",
                          "Message taiyaar hai. Send ka button aap dabao.",
                          "Your message is ready. Press send yourself."
                      ),
                      card = ActionCard("MESSAGE", who.uppercase(), "Press send yourself")
                  )
              }

              private fun openApp(a: Act.OpenApp, l: RLang): Outcome {
                  val info = Apps.find(ctx, a.name)
                  if (info == null) {
                      return Outcome(
                          tr(
                              l,
                              "\"${a.name}\" नाम का कोई ऐप मुझे नहीं मिला।",
                              "\"${a.name}\" naam ka koi app mujhe nahi mila.",
                              "I couldn't find an app called \"${a.name}\"."
                          ),
                          ok = false
                      )
                  }
                  val label = info.loadLabel(ctx.packageManager).toString()
                  val launch = ctx.packageManager.getLaunchIntentForPackage(info.activityInfo.packageName)
                  if (launch == null || !start(launch)) {
                      return Outcome(
                          tr(l, "$label नहीं खुल पाया।", "$label nahi khul paya.", "I couldn't open $label."),
                          ok = false
                      )
                  }
                  return Outcome(
                      reply = tr(l, "$label खोल रहा हूँ।", "$label khol raha hoon.", "Opening $label."),
                      card = ActionCard("OPENING", label.uppercase(), "")
                  )
              }

              private fun torch(a: Act.Torch, l: RLang): Outcome {
                  val cm = ctx.getSystemService(Context.CAMERA_SERVICE) as CameraManager
                  val id = cm.cameraIdList.firstOrNull { cid ->
                      cm.getCameraCharacteristics(cid).get(CameraCharacteristics.FLASH_INFO_AVAILABLE) == true
                  } ?: return Outcome(
                      tr(l, "इस फ़ोन में टॉर्च नहीं मिली।", "Is phone me torch nahi mili.", "This phone has no torch."),
                      ok = false
                  )
                  cm.setTorchMode(id, a.on)
                  return Outcome(
                      reply = if (a.on) tr(l, "टॉर्च चालू कर दी।", "Torch chalu kar di.", "Torch is on.")
                      else tr(l, "टॉर्च बंद कर दी।", "Torch band kar di.", "Torch is off."),
                      card = ActionCard(if (a.on) "TORCH ON" else "TORCH OFF", "FLASHLIGHT", "")
                  )
              }

              private fun volume(a: Act.Volume, l: RLang): Outcome {
                  val am = ctx.getSystemService(Context.AUDIO_SERVICE) as AudioManager
                  val max = am.getStreamMaxVolume(AudioManager.STREAM_MUSIC).coerceAtLeast(1)
                  when (a.mode) {
                      "mute" -> am.setStreamVolume(AudioManager.STREAM_MUSIC, 0, AudioManager.FLAG_SHOW_UI)
                      "max" -> am.setStreamVolume(AudioManager.STREAM_MUSIC, max, AudioManager.FLAG_SHOW_UI)
                      "down" -> for (k in 0 until 3) {
                          am.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_LOWER, if (k == 0) AudioManager.FLAG_SHOW_UI else 0)
                      }
                      else -> for (k in 0 until 3) {
                          am.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_RAISE, if (k == 0) AudioManager.FLAG_SHOW_UI else 0)
                      }
                  }
                  val pct = am.getStreamVolume(AudioManager.STREAM_MUSIC) * 100 / max
                  return Outcome(
                      reply = tr(l, "आवाज़ अब $pct% है।", "Awaaz ab $pct% hai.", "Volume is now $pct%."),
                      card = ActionCard("$pct%", "VOLUME", "")
                  )
              }

              private fun music(a: Act.Music, l: RLang): Outcome {
                  val raw = a.query.trim()
                  if (raw.startsWith("yt:")) {
                      val topic = raw.removePrefix("yt:").trim()
                      val opened = start(Intent(Intent.ACTION_VIEW, Uri.parse("https://www.youtube.com/results?search_query=" + Uri.encode(topic))))
                      return if (opened) {
                          Outcome(
                              reply = tr(l, "यूट्यूब पर खोज रहा हूँ।", "YouTube par dhoondh raha hoon.", "Searching YouTube."),
                              card = ActionCard("YOUTUBE", topic.uppercase(), "")
                          )
                      } else {
                          Outcome(tr(l, "यूट्यूब नहीं खुल पाया।", "YouTube nahi khul paya.", "I couldn't open YouTube."), ok = false)
                      }
                  }
                  val q = raw
                  var ok = false
                  if (q.isNotBlank()) {
                      ok = start(Intent(MediaStore.INTENT_ACTION_MEDIA_PLAY_FROM_SEARCH).apply {
                          putExtra(SearchManager.QUERY, q)
                          putExtra(MediaStore.EXTRA_MEDIA_FOCUS, "vnd.android.cursor.item/*")
                      })
                  } else {
                      ok = try {
                          start(Intent.makeMainSelectorActivity(Intent.ACTION_MAIN, Intent.CATEGORY_APP_MUSIC))
                      } catch (e: Exception) {
                          false
                      }
                  }
                  if (!ok) {
                      val search = if (q.isBlank()) "songs" else q
                      ok = start(Intent(Intent.ACTION_VIEW, Uri.parse("https://www.youtube.com/results?search_query=" + Uri.encode(search))))
                  }
                  if (!ok) {
                      return Outcome(
                          tr(l, "मुझे म्यूज़िक ऐप नहीं मिला।", "Mujhe music app nahi mila.", "I couldn't find a music app."),
                          ok = false
                      )
                  }
                  return Outcome(
                      reply = tr(l, "गाना चला रहा हूँ।", "Gaana chala raha hoon.", "Playing music."),
                      card = ActionCard("MUSIC", if (q.isBlank()) "PLAYER" else q.uppercase(), "")
                  )
              }

              private suspend fun note(a: Act.Note, l: RLang, n: String): Outcome {
                  val text = a.text.trim()
                  if (text.isBlank()) return ask(Act.Ask("note_text"), l)
                  repo.addNote(text)
                  return Outcome(
                      reply = tr(l, "ठीक है $n, नोट कर लिया।", "Theek hai $n, note kar liya.", "Got it, $n. I saved that note."),
                      card = ActionCard("SAVED", "NOTE", text.take(48))
                  )
              }

              private fun webSearch(a: Act.WebSearch, l: RLang): Outcome {
                  val ok = start(Intent(Intent.ACTION_VIEW, Uri.parse("https://www.google.com/search?q=" + Uri.encode(a.query))))
                  if (!ok) {
                      return Outcome(
                          tr(l, "ब्राउज़र नहीं खुल पाया।", "Browser nahi khul paya.", "I couldn't open the browser."),
                          ok = false
                      )
                  }
                  return Outcome(
                      reply = tr(l, "गूगल पर खोज रहा हूँ।", "Google par search kar raha hoon.", "Searching Google for you."),
                      card = ActionCard("SEARCH", a.query.uppercase().take(30), "")
                  )
              }

              private fun info(a: Act.Info, l: RLang): Outcome {
                  val c = Calendar.getInstance()
                  return when (a.kind) {
                      "time" -> {
                          val h = c.get(Calendar.HOUR_OF_DAY)
                          val m = c.get(Calendar.MINUTE)
                          val t = "${h12(h)}:${two(m)}"
                          Outcome(
                              reply = tr(
                                  l,
                                  "अभी $t बजे हैं।",
                                  "Abhi $t baje hain.",
                                  "It's $t" + (if (h < 12) " AM." else " PM.")
                              ),
                              card = ActionCard("${two(h)}:${two(m)}", "TIME NOW", "")
                          )
                      }
                      "date" -> {
                          val loc = if (l == RLang.HI) Locale("hi", "IN") else Locale.ENGLISH
                          val full = SimpleDateFormat("EEEE, d MMMM", loc).format(Date())
                          val day = SimpleDateFormat("EEEE", loc).format(Date())
                          val short = SimpleDateFormat("d MMM", Locale.ENGLISH).format(Date())
                          Outcome(
                              reply = tr(l, "आज $full है।", "Aaj $full hai.", "Today is $full."),
                              card = ActionCard(short.uppercase(), day.uppercase(), "")
                          )
                      }
                      "battery" -> {
                          val bm = ctx.getSystemService(Context.BATTERY_SERVICE) as BatteryManager
                          val pct = bm.getIntProperty(BatteryManager.BATTERY_PROPERTY_CAPACITY)
                          Outcome(
                              reply = tr(l, "बैटरी $pct% है।", "Battery $pct% hai.", "Battery is at $pct%."),
                              card = ActionCard("$pct%", "BATTERY", "")
                          )
                      }
                      else -> Outcome()
                  }
              }

              private fun ask(a: Act.Ask, l: RLang): Outcome {
                  val text = when (a.key) {
                      "alarm_time" -> tr(l, "किस समय का अलार्म लगाऊँ?", "Kitne baje ka alarm laga doon?", "What time should I set the alarm for?")
                      "timer_len" -> tr(l, "कितनी देर का टाइमर लगाऊँ?", "Kitni der ka timer laga doon?", "How long should the timer run?")
                      "call_who" -> tr(l, "किसे कॉल करना है?", "Kisko call karna hai?", "Who should I call?")
                      "app_name" -> tr(l, "कौन सा ऐप खोलूँ?", "Kaun sa app kholun?", "Which app should I open?")
                      "note_text" -> tr(l, "क्या नोट करूँ?", "Kya note karoon?", "What should I note down?")
                      else -> tr(l, "थोड़ा और बताइए।", "Thoda aur batao.", "Tell me a bit more.")
                  }
                  return Outcome(text, ok = false)
              }
          }

          // ---------------------------------------------------------------------- contacts

          /** Finds people in your phone book, even when you say "Mummy" and the contact says "Mom". */
          object Contacts {
              data class Contact(val id: Long, val name: String, val number: String)
              data class Match(val contact: Contact, val score: Int)

              fun load(ctx: Context): List<Contact> {
                  val out = ArrayList<Contact>()
                  val seen = HashSet<Long>()
                  val cols = arrayOf(Phone.CONTACT_ID, Phone.DISPLAY_NAME, Phone.NUMBER)
                  val cursor = ctx.contentResolver.query(Phone.CONTENT_URI, cols, null, null, null)
                  cursor?.use { c ->
                      val iId = c.getColumnIndex(Phone.CONTACT_ID)
                      val iName = c.getColumnIndex(Phone.DISPLAY_NAME)
                      val iNum = c.getColumnIndex(Phone.NUMBER)
                      while (c.moveToNext()) {
                          val id = c.getLong(iId)
                          if (!seen.add(id)) continue
                          val name = c.getString(iName) ?: continue
                          val num = c.getString(iNum) ?: continue
                          out.add(Contact(id, name, num))
                      }
                  }
                  return out
              }

              fun find(ctx: Context, query: String): List<Match> {
                  return load(ctx)
                      .map { Match(it, score(query, it.name)) }
                      .filter { it.score >= 50 }
                      .sortedByDescending { it.score }
              }

              fun score(query: String, name: String): Int {
                  val q = Norm.text(query)
                  val n = Norm.text(name)
                  if (q.isEmpty() || n.isEmpty()) return 0
                  val qTokens = q.split(' ')
                  val nTokens = n.split(' ')
                  if (n == q) return 100
                  if (nTokens.any { it == q }) return 90
                  if (n.startsWith(q)) return 85
                  if (nTokens.any { it.startsWith(q) }) return 80
                  // "Mummy" the user says vs "Mom" in the phone
                  val group = P.aliasGroups.firstOrNull { g -> qTokens.any { it in g } }
                  if (group != null && nTokens.any { it in group }) return 75
                  if (q.length >= 3 && n.contains(q)) return 65
                  if (q.length >= 4) {
                      val best = nTokens.minOfOrNull { Text.distance(it, q) } ?: 99
                      if (best <= 2) return 55
                  }
                  return 0
              }
          }

          // ---------------------------------------------------------------------- apps

          /** Finds an installed app by its name, in Hindi or English. */
          object Apps {
              fun find(ctx: Context, query: String): ResolveInfo? {
                  val pm = ctx.packageManager
                  val intent = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                  val apps = pm.queryIntentActivities(intent, 0)
                  val whole = Norm.text(query)
                  val q = P.appAliases[whole] ?: Norm.tokens(query).joinToString(" ") { P.appAliases[it] ?: it }
                  if (q.isBlank()) return null
                  var best: ResolveInfo? = null
                  var bestScore = 0
                  for (ri in apps) {
                      val label = Norm.text(ri.loadLabel(pm).toString())
                      val s = score(q, label)
                      if (s > bestScore) {
                          bestScore = s
                          best = ri
                      }
                  }
                  return if (bestScore >= 55) best else null
              }

              private fun score(q: String, label: String): Int {
                  if (label.isEmpty()) return 0
                  if (label == q) return 100
                  if (label.startsWith(q)) return 85
                  if (q.length >= 3 && label.contains(q)) return 70
                  if (label.length >= 4 && q.contains(label)) return 65
                  if (q.length >= 4 && Text.distance(label, q) <= 2) return 55
                  // sounds-alike match: "सर्विस क्लाउड" ~ "Service Cloud"
                  val qs = skeleton(q)
                  val ls = skeleton(label)
                  if (qs.length >= 4 && ls.length >= 3) {
                      if (ls.contains(qs)) return 62
                      if (ls.length >= 4 && qs.contains(ls)) return 58
                      if (Text.distance(qs, ls) <= maxOf(1, minOf(qs.length, ls.length) / 5)) return 58
                  }
                  return 0
              }

              private val devaToLatin: Map<Char, String> = mapOf(
                  'क' to "k", 'ख' to "k", 'ग' to "g", 'घ' to "g", 'च' to "k", 'छ' to "k", 'ज' to "j", 'झ' to "j",
                  'ट' to "t", 'ठ' to "t", 'ड' to "d", 'ढ' to "d", 'त' to "t", 'थ' to "t", 'द' to "d", 'ध' to "d",
                  'न' to "n", 'ण' to "n", 'प' to "p", 'फ' to "f", 'ब' to "b", 'भ' to "b", 'म' to "m", 'र' to "r",
                  'ल' to "l", 'व' to "v", 'श' to "s", 'ष' to "s", 'स' to "s", 'ह' to "h"
              )

              /** The consonants of a word, written in plain Latin letters, so Hindi and English spellings can be compared by sound. */
              private fun skeleton(text: String): String {
                  val sb = StringBuilder()
                  for (ch in text.lowercase()) {
                      val mapped = devaToLatin[ch]
                      if (mapped != null) {
                          sb.append(mapped)
                      } else if (ch in 'a'..'z') {
                          when (ch) {
                              'a', 'e', 'i', 'o', 'u', 'y', 'w', 'h' -> {}
                              'c', 'q' -> sb.append('k')
                              'z' -> sb.append('s')
                              else -> sb.append(ch)
                          }
                      }
                  }
                  val out = StringBuilder()
                  for (ch in sb) if (out.isEmpty() || out.last() != ch) out.append(ch)
                  return out.toString()
              }
          }

          object Text {
              /** How many single-letter edits turn a into b (small number = similar). */
              fun distance(a: String, b: String): Int {
                  if (a == b) return 0
                  if (a.isEmpty()) return b.length
                  if (b.isEmpty()) return a.length
                  var prev = IntArray(b.length + 1) { it }
                  for (i in 1..a.length) {
                      val cur = IntArray(b.length + 1)
                      cur[0] = i
                      for (j in 1..b.length) {
                          val cost = if (a[i - 1] == b[j - 1]) 0 else 1
                          cur[j] = minOf(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + cost)
                      }
                      prev = cur
                  }
                  return prev[b.length]
              }
          }
