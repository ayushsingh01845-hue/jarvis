          package com.jarvis.app.wake

          import android.content.Context
          import android.content.Intent
          import androidx.core.content.ContextCompat
          import kotlinx.coroutines.flow.MutableSharedFlow

          /**
           * The small message board between the background listener (WakeService) and the app screens.
           * pending = "Hey Jarvis was heard, the app should start listening now".
           * busy = "the app itself is using the microphone or speaker, so the wake listener must stay quiet".
           */
          object WakeBus {
              val events = MutableSharedFlow<Unit>(extraBufferCapacity = 1)

              @Volatile var pending = false
              @Volatile var busy = false
              @Volatile var active = false          // the background listener is running

              /** Set by the service (main thread) so it can release the microphone at once. */
              var busyListener: (() -> Unit)? = null

              fun markBusy(b: Boolean) {
                  busy = b
                  if (b) busyListener?.invoke()
              }
          }

          object WakeControl {
              fun start(ctx: Context) {
                  try {
                      ContextCompat.startForegroundService(ctx, Intent(ctx, WakeService::class.java))
                  } catch (e: Exception) {
                      // Android refuses this when the app is in the background. It is tried again next time the app opens.
                  }
              }

              fun stop(ctx: Context) {
                  try {
                      ctx.stopService(Intent(ctx, WakeService::class.java))
                  } catch (e: Exception) {
                  }
                  WakeBus.active = false
              }
          }
