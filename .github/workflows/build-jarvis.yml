          package com.jarvis.app.brain

          /** Everything Jarvis can do on the phone. The router and Gemini both produce these. */
          sealed class Act {
              data class Alarm(val hour: Int, val minute: Int, val label: String = "") : Act()
              data class Timer(val seconds: Int) : Act()
              data class Call(val name: String) : Act()
              data class Sms(val name: String, val text: String) : Act()
              data class OpenApp(val name: String) : Act()
              data class Torch(val on: Boolean) : Act()
              data class Volume(val mode: String) : Act()          // up, down, mute, max
              data class Music(val query: String) : Act()
              data class Note(val text: String) : Act()
              data class WebSearch(val query: String) : Act()
              data class Info(val kind: String) : Act()            // time, date, battery
              data class Ask(val key: String) : Act()              // Jarvis needs one more detail from you
              object None : Act()
          }

          /** What happens when you tap the action card. */
          enum class CardTap { NONE, CANCEL_CALL, PERMISSIONS }

          /** The little result box inside Jarvis's chat bubble (big text + small caption). */
          data class ActionCard(
              val big: String,
              val small: String,
              val sub: String = "",
              val tap: CardTap = CardTap.NONE
          )

          data class PendingCall(val name: String, val number: String)

          /** The result of doing an Act. */
          data class Outcome(
              val reply: String? = null,
              val card: ActionCard? = null,
              val ok: Boolean = true,
              val pendingCall: PendingCall? = null
          )
          JARVIS_EOF
          mkdir -p "app/src/main/java/com/jarvis/app/brain"
          cat > app/src/main/java/com/jarvis/app/brain/Gemini.kt <<'JARVIS_EOF'
          package com.jarvis.app.brain

          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import org.json.JSONArray
          import org.json.JSONException
          import org.json.JSONObject
          import java.io.IOException
          import java.net.HttpURLConnection
          import java.net.URL

          /**
           * The smart brain (Google Gemini). Used only when the local router did not understand.
           * Only the text you said (plus a few recent messages) is sent. Nothing else leaves the phone.
           */
          object Gemini {

              class GeminiError(val code: String, val detail: String = "") : Exception(code)

              data class Reply(val text: String, val act: Act, val model: String = "", val emotion: String = "")

              private const val BASE = "https://generativelanguage.googleapis.com/v1beta/models"

              // Used only if Google's own list of models cannot be read.
              private val fallbackModels = listOf("gemini-flash-latest", "gemini-2.5-flash", "gemini-2.0-flash")

              private var modelCache: List<String>? = null

              // The model that answered last time. It is tried first, so later answers are quick.
              @Volatile private var goodModel: String? = null

              /** history = earlier messages: (true = you, false = Jarvis, text) */
              suspend fun ask(
                  key: String,
                  userName: String,
                  languageSetting: String,
                  history: List<Pair<Boolean, String>>,
                  text: String,
                  savedModel: String = ""
              ): Reply = withContext(Dispatchers.IO) {
                  if (key.isBlank()) throw GeminiError("nokey")
                  val body = buildBody(userName, languageSetting, history, text, false)
                  val bodyNoThink = buildBody(userName, languageSetting, history, text, true)

                  if (goodModel == null && savedModel.isNotBlank()) goodModel = savedModel
                  val good = goodModel
                  val found = if (good != null) {
                      emptyList()
                  } else {
                      try {
                          listModels(key)
                      } catch (e: IOException) {
                          emptyList()
                      }
                  }
                  val candidates = (listOfNotNull(good) + found + fallbackModels).distinct().take(10)

                  var last = GeminiError("http", "no model")
                  var sawRate = false
                  var ioError: IOException? = null
                  for (m in candidates) {
                      try {
                          // 2.5 models "think" before answering, which is slow; switch that off
                          val reply = parseReply(callOnce(m, key, if (m.contains("2.5")) bodyNoThink else body))
                          goodModel = m
                          return@withContext reply.copy(model = m)
                      } catch (e: IOException) {
                          // too slow or no connection on this model: move on to the next one quickly
                          if (m == good) goodModel = null
                          ioError = e
                          last = GeminiError("http", m + " slow")
                      } catch (e: GeminiError) {
                          if (m == good) goodModel = null
                          when (e.code) {
                              "retry" -> last = GeminiError("http", e.detail)
                              "rate" -> {
                                  sawRate = true
                                  last = GeminiError("rate", m + " HTTP 429")
                              }
                              else -> throw e
                          }
                      }
                  }
                  if (sawRate) throw GeminiError("rate", last.detail)
                  ioError?.let { throw it }
                  throw last
              }

              // ------------------------------------------------------------------ request

              private fun systemPrompt(userName: String, languageSetting: String): String {
                  val langRule = when (languageSetting) {
                      "HINDI" -> "Always reply in Hindi written in Devanagari script."
                      "ENGLISH" -> "Always reply in English."
                      else -> "Reply in the language the user used: Hindi in Devanagari, Hinglish in simple Roman letters, or English."
                  }
                  return listOf(
                      "You are Jarvis, $userName's close friend who happens to live in his phone. Talk like a real dost: relaxed, warm, playful, a little teasing, never stiff.",
                      "The user speaks Hindi, English or Hinglish. Sound like a friend chatting, using casual words such as yaar, bhai, arre, chal, haan, achha now and then, but not in every sentence. Never sound like a formal assistant or an AI: no \"How may I assist you\", no \"Certainly\", no \"As an AI\", no lecturing. React to the mood: joke back, show you care, give your honest opinion when asked.",
                      langRule,
                      "Keep every reply to one or two short sentences unless the user asks for more. Your reply is spoken aloud, so use no markdown, no lists and no emoji.",
                      "You cannot see live data such as news, weather or prices. Say so honestly instead of guessing.",
                      "Reply with JSON only, exactly in this shape: {\"reply\":\"text\",\"lang\":\"hi or en\",\"emotion\":\"neutral\",\"action\":{\"type\":\"none\",\"args\":{}}}",
                      "emotion is how your face should feel while replying, one of: neutral, happy, laugh, sad, surprised, angry, love, wink, sleepy. Mirror the user like a real friend: laugh when they joke or laugh, sad (and comforting) when they are sad or crying, surprised at big news, love for affection, wink for playful teasing, angry only in a playful way, happy for good news or thanks.",
                      "Allowed action types and their args: alarm {hour 0-23, minute 0-59, label}, timer {seconds}, call {name}, sms {name, text}, open_app {name}, torch {state: on or off}, volume {direction: up, down, mute or max}, music {query}, note {text}, reminder {text, hour, minute}, web_search {query}, none {}.",
                      "Use action none for normal conversation. Use another action only when the user clearly asks for it. When you set an action, the reply says briefly what you are doing."
                  ).joinToString("\n")
              }

              private fun buildBody(
                  userName: String,
                  languageSetting: String,
                  history: List<Pair<Boolean, String>>,
                  text: String,
                  noThink: Boolean
              ): String {
                  // Gemini wants turns that start with "user" and alternate; merge neighbours of the same role.
                  val turns = ArrayList<Pair<String, String>>()
                  for ((fromUser, t) in history.takeLast(4) + Pair(true, text)) {
                      val role = if (fromUser) "user" else "model"
                      if (turns.isEmpty() && role == "model") continue
                      if (turns.isNotEmpty() && turns.last().first == role) {
                          turns[turns.size - 1] = Pair(role, turns.last().second + "\n" + t)
                      } else {
                          turns.add(Pair(role, t))
                      }
                  }
                  val contents = JSONArray()
                  for ((role, t) in turns) {
                      contents.put(
                          JSONObject()
                              .put("role", role)
                              .put("parts", JSONArray().put(JSONObject().put("text", t)))
                      )
                  }
                  return JSONObject()
                      .put(
                          "systemInstruction",
                          JSONObject().put("parts", JSONArray().put(JSONObject().put("text", systemPrompt(userName, languageSetting))))
                      )
                      .put("contents", contents)
                      .put("generationConfig", config(noThink))
                      .toString()
              }

              private fun config(noThink: Boolean): JSONObject {
                  val c = JSONObject().put("maxOutputTokens", 400).put("temperature", 0.6)
                  if (noThink) c.put("thinkingConfig", JSONObject().put("thinkingBudget", 0))
                  return c
              }

              /** Asks Google which models this key can use right now, and prefers fast, stable ones. */
              private fun listModels(key: String): List<String> {
                  modelCache?.let { return it }
                  val conn = URL("$BASE?pageSize=200").openConnection() as HttpURLConnection
                  try {
                      conn.connectTimeout = 15000
                      conn.readTimeout = 20000
                      conn.setRequestProperty("x-goog-api-key", key)
                      val code = conn.responseCode
                      if (code == 401 || code == 403) throw GeminiError("nokey")
                      if (code !in 200..299) return emptyList()
                      val text = conn.inputStream.bufferedReader(Charsets.UTF_8).use { it.readText() }
                      val names = ArrayList<String>()
                      try {
                          val arr = JSONObject(text).optJSONArray("models") ?: return emptyList()
                          val skip = listOf("image", "tts", "live", "audio", "embed", "vision", "thinking", "robotics", "computer", "native", "exp")
                          for (i in 0 until arr.length()) {
                              val o = arr.getJSONObject(i)
                              val methods = o.optJSONArray("supportedGenerationMethods") ?: continue
                              var ok = false
                              for (j in 0 until methods.length()) {
                                  if (methods.getString(j) == "generateContent") ok = true
                              }
                              if (!ok) continue
                              val name = o.optString("name").removePrefix("models/")
                              val low = name.lowercase()
                              if (!low.contains("flash")) continue
                              if (skip.any { low.contains(it) }) continue
                              names.add(name)
                          }
                      } catch (e: JSONException) {
                          return emptyList()
                      }
                      val sorted = names.sortedWith(
                          compareBy<String>({ it.contains("preview") }, { !it.contains("lite") }).thenByDescending { it }
                      )
                      modelCache = sorted
                      return sorted
                  } finally {
                      conn.disconnect()
                  }
              }

              private fun callOnce(model: String, key: String, body: String): String {
                  val conn = URL("$BASE/${model}:generateContent").openConnection() as HttpURLConnection
                  try {
                      conn.requestMethod = "POST"
                      conn.connectTimeout = 8000
                      conn.readTimeout = 14000
                      conn.doOutput = true
                      conn.setRequestProperty("Content-Type", "application/json; charset=utf-8")
                      conn.setRequestProperty("x-goog-api-key", key)
                      conn.outputStream.use { it.write(body.toByteArray(Charsets.UTF_8)) }
                      val code = conn.responseCode
                      if (code in 200..299) {
                          val text = conn.inputStream.bufferedReader(Charsets.UTF_8).use { it.readText() }
                          try {
                              val cands = JSONObject(text).optJSONArray("candidates")
                              val parts = cands?.optJSONObject(0)?.optJSONObject("content")?.optJSONArray("parts")
                              val sb = StringBuilder()
                              if (parts != null) {
                                  for (i in 0 until parts.length()) sb.append(parts.getJSONObject(i).optString("text", ""))
                              }
                              if (sb.isEmpty()) throw GeminiError("retry", "$model empty")
                              return sb.toString()
                          } catch (e: JSONException) {
                              throw GeminiError("retry", "$model parse")
                          }
                      }
                      val errText = try {
                          conn.errorStream?.bufferedReader(Charsets.UTF_8)?.use { it.readText() } ?: ""
                      } catch (e: Exception) {
                          ""
                      }
                      if (code == 429) throw GeminiError("rate")
                      if (code == 401 || code == 403 || (code == 400 && errText.contains("API key", ignoreCase = true))) {
                          throw GeminiError("nokey")
                      }
                      if (code == 404 || code == 400 || code >= 500) throw GeminiError("retry", "$model HTTP $code")
                      throw GeminiError("http", "HTTP $code")
                  } finally {
                      conn.disconnect()
                  }
              }

              // ------------------------------------------------------------------ answer

              /** Reads Gemini's JSON answer. If it is not JSON, the plain text is just spoken. */
              private fun parseReply(raw: String): Reply {
                  val cleaned = raw.trim().removePrefix("```json").removePrefix("```").removeSuffix("```").trim()
                  val a = cleaned.indexOf('{')
                  val b = cleaned.lastIndexOf('}')
                  if (a >= 0 && b > a) {
                      try {
                          val o = JSONObject(cleaned.substring(a, b + 1))
                          val reply = o.optString("reply", "")
                          if (reply.isNotEmpty()) {
                              val action = o.optJSONObject("action")
                              return Reply(reply, toAct(action), "", o.optString("emotion", ""))
                          }
                      } catch (e: JSONException) {
                          // fall through: speak the plain text
                      }
                  }
                  return Reply(cleaned, Act.None)
              }

              private fun toAct(action: JSONObject?): Act {
                  if (action == null) return Act.None
                  val args = action.optJSONObject("args") ?: JSONObject()
                  return when (action.optString("type", "none")) {
                      "alarm" -> {
                          val h = args.optInt("hour", -1)
                          val m = args.optInt("minute", 0)
                          if (h in 0..23 && m in 0..59) Act.Alarm(h, m, args.optString("label", "")) else Act.None
                      }
                      "timer" -> {
                          val s = args.optInt("seconds", 0)
                          if (s > 0) Act.Timer(s) else Act.None
                      }
                      "call" -> args.optString("name", "").let { if (it.isNotBlank()) Act.Call(it) else Act.None }
                      "sms" -> Act.Sms(args.optString("name", ""), args.optString("text", ""))
                      "open_app" -> args.optString("name", "").let { if (it.isNotBlank()) Act.OpenApp(it) else Act.None }
                      "torch" -> Act.Torch(args.optString("state", "on").lowercase() != "off")
                      "volume" -> Act.Volume(args.optString("direction", "up").lowercase())
                      "music" -> Act.Music(args.optString("query", ""))
                      "note" -> args.optString("text", "").let { if (it.isNotBlank()) Act.Note(it) else Act.None }
                      "reminder" -> {
                          val text = args.optString("text", "")
                          val h = args.optInt("hour", -1)
                          val m = args.optInt("minute", 0)
                          if (h in 0..23 && m in 0..59) Act.Alarm(h, m, text)
                          else if (text.isNotBlank()) Act.Note(text) else Act.None
                      }
                      "web_search" -> args.optString("query", "").let { if (it.isNotBlank()) Act.WebSearch(it) else Act.None }
                      else -> Act.None
                  }
              }
          }
