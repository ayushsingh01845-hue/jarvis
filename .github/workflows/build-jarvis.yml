          package com.jarvis.app.voice

          import android.content.Context
          import android.speech.tts.TextToSpeech
          import android.speech.tts.UtteranceProgressListener
          import android.speech.tts.Voice
          import java.util.Locale

          /**
           * Voice out. Wraps Android's built-in TextToSpeech.
           * Hindi (Devanagari) text uses the hi-IN voice; everything else uses the en-IN voice.
           * onSpeaking(true) when the voice starts, onSpeaking(false) when it ends (may come from another thread).
           */
          class Speaker(ctx: Context, private val onSpeaking: (Boolean) -> Unit) {

              private var ready = false
              private var tts: TextToSpeech? = null

              init {
                  tts = TextToSpeech(ctx) { status ->
                      ready = status == TextToSpeech.SUCCESS
                      if (ready) {
                          tts?.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                              override fun onStart(utteranceId: String?) {
                                  onSpeaking(true)
                              }

                              override fun onDone(utteranceId: String?) {
                                  onSpeaking(false)
                              }

                              @Deprecated("Deprecated in Java")
                              override fun onError(utteranceId: String?) {
                                  onSpeaking(false)
                              }
                          })
                      }
                  }
              }

              /** Returns true if speech was started. */
              fun speak(
                  text: String,
                  rate: Float,
                  male: Boolean = false,
                  voiceHi: String = "",
                  voiceEn: String = "",
                  pitch: Float = 1.0f
              ): Boolean {
                  val engine = tts
                  if (!ready || engine == null || text.isBlank()) return false
                  val hindi = text.any { it in 'ऀ'..'ॿ' }
                  val wanted = if (hindi) Locale("hi", "IN") else Locale("en", "IN")
                  val result = engine.setLanguage(wanted)
                  if (result == TextToSpeech.LANG_MISSING_DATA || result == TextToSpeech.LANG_NOT_SUPPORTED) {
                      engine.setLanguage(Locale.ENGLISH)
                  }
                  var chosen = false
                  val wantedName = if (hindi) voiceHi else voiceEn
                  if (wantedName.isNotBlank()) {
                      try {
                          val v = engine.voices?.firstOrNull { it.name == wantedName }
                          if (v != null) {
                              engine.setVoice(v)
                              chosen = true
                          }
                      } catch (e: Exception) {
                      }
                  }
                  var maleFound = false
                  if (male && !chosen) {
                      val v = pickMaleVoice(engine, wanted)
                      if (v != null) {
                          try {
                              engine.setVoice(v)
                              maleFound = true
                          } catch (e: Exception) {
                          }
                      }
                  }
                  // no male voice installed: a lower pitch is the next best thing
                  engine.setPitch(pitch.coerceIn(0.5f, 2.0f) * (if (male && !chosen && !maleFound) 0.78f else 1.0f))
                  engine.setSpeechRate(rate.coerceIn(0.5f, 2.0f))
                  return engine.speak(text, TextToSpeech.QUEUE_FLUSH, null, "jarvis") == TextToSpeech.SUCCESS
              }

              /** The voices installed on this phone for a language ("hi" or "en"): (technical name, friendly label). */
              fun voices(lang: String): List<Pair<String, String>> {
                  val engine = tts ?: return emptyList()
                  if (!ready) return emptyList()
                  val all = try {
                      engine.voices
                  } catch (e: Exception) {
                      null
                  } ?: return emptyList()
                  val maleCodes = setOf("enb", "end", "hib", "hic")
                  val list = all.filter { it.locale.language == lang }
                      .sortedWith(compareBy<Voice>({ it.locale.country != "IN" }, { it.isNetworkConnectionRequired }, { it.name }))
                  return list.mapIndexed { i, v ->
                      val name = v.name.lowercase()
                      val code = name.substringAfter("-x-", "").substringBefore('-')
                      val sex = when {
                          (name.contains("male") && !name.contains("female")) || code in maleCodes -> "male"
                          name.contains("female") -> "female"
                          else -> ""
                      }
                      val label = "Voice " + (i + 1) + (if (sex.isNotEmpty()) " ($sex)" else "") + (if (v.isNetworkConnectionRequired) " online" else "")
                      Pair(v.name, label)
                  }
              }

              /** Looks for a male voice of this language among the voices installed on the phone. */
              private fun pickMaleVoice(engine: TextToSpeech, wanted: Locale): Voice? {
                  val all = try {
                      engine.voices
                  } catch (e: Exception) {
                      null
                  } ?: return null
                  val maleCodes = setOf("enb", "end", "hib", "hic")
                  val candidates = all.filter { v ->
                      if (v.locale.language != wanted.language) return@filter false
                      val name = v.name.lowercase()
                      val code = name.substringAfter("-x-", "").substringBefore('-')
                      (name.contains("male") && !name.contains("female")) || code in maleCodes
                  }
                  if (candidates.isEmpty()) return null
                  return candidates.sortedWith(
                      compareBy<Voice>({ it.locale.country != wanted.country }, { it.isNetworkConnectionRequired })
                  ).first()
              }

              fun stop() {
                  try {
                      tts?.stop()
                  } catch (e: Exception) {
                  }
              }

              fun shutdown() {
                  try {
                      tts?.stop()
                      tts?.shutdown()
                  } catch (e: Exception) {
                  }
                  tts = null
              }
          }
