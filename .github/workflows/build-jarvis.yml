          package com.jarvis.app.brain

          import java.util.Locale

          /** Which language style a reply is written in. */
          enum class RLang { HI, HING, EN }   // Hindi (Devanagari), Hinglish (Roman letters), English

          /** Pick the text for the current reply language. */
          fun tr(l: RLang, hi: String, hing: String, en: String): String = when (l) {
              RLang.HI -> hi
              RLang.HING -> hing
              RLang.EN -> en
          }

          object LangUtil {
              fun hasDevanagari(s: String): Boolean = s.any { it in 'ऀ'..'ॿ' }

              /** Words that only appear in Hinglish (Hindi written in English letters). */
              private val hinglish = setOf(
                  "karo", "kar", "kya", "hai", "hain", "hoon", "mujhe", "mera", "meri", "mere", "ko", "ki", "ke",
                  "se", "aaj", "kal", "baje", "bje", "laga", "lagao", "dena", "chalao", "kholo", "khol", "batao",
                  "bata", "nahi", "nahin", "haan", "acha", "achha", "theek", "subah", "shaam", "raat", "gaana",
                  "gana", "gaane", "uthao", "jagao", "jaga", "bhejo", "bhej", "bolo", "likho", "likh", "yaad",
                  "mummy", "papa", "bhai", "didi", "kitne", "kitna", "samay", "tareekh", "awaaz", "awaz",
                  "badhao", "kam", "band", "chalu", "bujhao", "dhundo", "sunao", "bajao", "aur", "phir", "zara",
                  "abhi", "mat", "rakh", "rakho", "wala", "wali", "kaisa", "kaise", "kaun", "kahan", "kyun", "toh"
              )

              /**
               * Decide the reply style from what the user typed or said.
               * Settings: HINDI -> Hindi, ENGLISH -> English, AUTO -> copy the user.
               */
              fun detect(input: String, setting: String): RLang {
                  if (setting == "HINDI") return RLang.HI
                  if (setting == "ENGLISH") return RLang.EN
                  if (hasDevanagari(input)) return RLang.HI
                  val tokens = input.lowercase(Locale.ROOT).split(Regex("[^a-z]+")).filter { it.isNotEmpty() }
                  return if (tokens.any { it in hinglish }) RLang.HING else RLang.EN
              }
          }
