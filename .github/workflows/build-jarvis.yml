          package com.jarvis.app.ui

          import androidx.compose.foundation.Canvas
          import androidx.compose.foundation.layout.Box
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.foundation.layout.size
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.LaunchedEffect
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableFloatStateOf
          import androidx.compose.runtime.remember
          import androidx.compose.runtime.rememberUpdatedState
          import androidx.compose.runtime.setValue
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.geometry.Offset
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.StrokeCap
          import androidx.compose.ui.graphics.drawscope.Stroke
          import androidx.compose.ui.unit.Dp
          import androidx.compose.ui.unit.dp
          import com.jarvis.app.OrbState
          import kotlin.math.PI
          import kotlin.math.abs
          import kotlin.math.cos
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.sin

          /**
           * The Voice Halo. A glowing core surrounded by a ring of sound bars.
           * Listening: the bars jump with your voice. Speaking: they ripple. Thinking: a light runs around the ring.
           * Idle: they breathe softly. Error: red.
           */
          @Composable
          fun Orb(
              state: OrbState,
              level: Float,
              modifier: Modifier = Modifier,
              diameter: Dp = 210.dp,
              onClick: () -> Unit = {}
          ) {
              val accent = LocalAccent.current
              val reduce = LocalReduceMotion.current
              val color = if (state == OrbState.ERROR) JC.Red else accent

              var time by remember { mutableFloatStateOf(0f) }
              var smooth by remember { mutableFloatStateOf(0f) }
              val levelNow by rememberUpdatedState(level)
              val stateNow by rememberUpdatedState(state)

              LaunchedEffect(reduce) {
                  if (!reduce) {
                      var last = 0L
                      while (true) {
                          androidx.compose.runtime.withFrameNanos { now ->
                              if (last != 0L) {
                                  val dt = ((now - last) / 1_000_000_000f).coerceAtMost(0.1f)
                                  time += dt
                                  smooth += (levelNow - smooth) * min(1f, dt * 14f)
                              }
                              last = now
                          }
                      }
                  }
              }

              Box(
                  modifier
                      .size(diameter)
                      .pressable(onClick = onClick),
                  contentAlignment = Alignment.Center
              ) {
                  Canvas(Modifier.fillMaxSize()) {
                      val c = Offset(size.width / 2f, size.height / 2f)
                      val outer = size.minDimension / 2f
                      val t = time
                      val sm = smooth
                      val st = stateNow
                      val n = 64
                      val twoPi = (2 * PI).toFloat()

                      val breathe = 1f + 0.03f * sin(t * 1.8f)
                      val coreR = outer * 0.36f * breathe * (if (st == OrbState.LISTENING) 1f + sm * 0.10f else 1f)
                      val inner = coreR + 9.dp.toPx()
                      val maxLen = outer - inner - 2.dp.toPx()

                      // soft glow behind everything
                      drawCircle(
                          brush = Brush.radialGradient(
                              colors = listOf(color.copy(alpha = 0.30f + 0.25f * sm), Color.Transparent),
                              center = c,
                              radius = outer
                          ),
                          radius = outer,
                          center = c
                      )

                      // the ring of bars
                      val sweep = (t * 2.4f) % twoPi
                      for (i in 0 until n) {
                          val a = i.toFloat() / n * twoPi - (PI / 2).toFloat()
                          val m = min(i, n - i)            // mirrored, so left and right look the same
                          val wave = (sin(m * 0.55f + t * 3.2f) * 0.5f + 0.5f) * (cos(m * 0.21f - t * 1.7f) * 0.5f + 0.5f)
                          var f = 0f
                          var alpha = 1f
                          when (st) {
                              OrbState.LISTENING -> {
                                  f = 0.10f + (0.15f + 0.85f * sm) * (0.30f + 0.70f * wave)
                                  alpha = 0.55f + 0.45f * f
                              }
                              OrbState.SPEAKING -> {
                                  f = 0.14f + 0.50f * (0.25f + 0.75f * wave) * (0.75f + 0.25f * sin(t * 7f + m * 0.35f))
                                  alpha = 0.6f + 0.4f * f
                              }
                              OrbState.THINKING -> {
                                  val an = i.toFloat() / n * twoPi
                                  var d = abs(an - sweep)
                                  d = min(d, twoPi - d)
                                  val hl = max(0f, 1f - d / 1.1f)
                                  f = 0.10f + 0.08f * wave + 0.55f * hl
                                  alpha = 0.30f + 0.70f * hl
                              }
                              OrbState.ERROR -> {
                                  f = 0.12f + 0.10f * (sin(t * 14f) * 0.5f + 0.5f)
                                  alpha = 0.9f
                              }
                              OrbState.IDLE -> {
                                  f = 0.08f + 0.12f * wave
                                  alpha = 0.5f + 0.2f * wave
                              }
                          }
                          val len = f.coerceIn(0.05f, 1f) * maxLen
                          val dx = cos(a)
                          val dy = sin(a)
                          drawLine(
                              color = color.copy(alpha = alpha.coerceIn(0f, 1f)),
                              start = Offset(c.x + dx * inner, c.y + dy * inner),
                              end = Offset(c.x + dx * (inner + len), c.y + dy * (inner + len)),
                              strokeWidth = 3.2.dp.toPx(),
                              cap = StrokeCap.Round
                          )
                      }

                      // glass core
                      drawCircle(
                          brush = Brush.radialGradient(
                              colors = listOf(color.copy(alpha = 0.75f), color.copy(alpha = 0.20f), Color.Black.copy(alpha = 0.92f)),
                              center = Offset(c.x - coreR * 0.25f, c.y - coreR * 0.30f),
                              radius = coreR * 1.5f
                          ),
                          radius = coreR,
                          center = c
                      )
                      drawCircle(
                          color = Color.White.copy(alpha = 0.28f),
                          radius = coreR,
                          center = c,
                          style = Stroke(width = 1.dp.toPx())
                      )
                      // bright heart that swells with sound
                      drawCircle(
                          color = Color.White.copy(alpha = 0.9f),
                          radius = coreR * (0.16f + 0.10f * sm + (if (st == OrbState.SPEAKING) 0.04f * sin(t * 9f) else 0f)),
                          center = c
                      )
                  }
              }
          }

          /** The Jarvis logo mark: a glowing core inside a ring of sound bars. Not a letter. */
          @Composable
          fun JarvisMark(modifier: Modifier = Modifier) {
              val color = LocalAccent.current
              Canvas(modifier) {
                  val c = Offset(size.width / 2f, size.height / 2f)
                  val outer = size.minDimension / 2f
                  val coreR = outer * 0.34f
                  val inner = coreR + outer * 0.12f
                  val maxLen = outer - inner
                  val pattern = floatArrayOf(0.5f, 0.8f, 1.0f, 0.65f, 0.9f, 0.55f, 0.75f)
                  val n = 20
                  val twoPi = (2 * PI).toFloat()
                  for (i in 0 until n) {
                      val a = i.toFloat() / n * twoPi - (PI / 2).toFloat()
                      val h = pattern[min(i, n - i) % pattern.size]
                      drawLine(
                          color = color,
                          start = Offset(c.x + cos(a) * inner, c.y + sin(a) * inner),
                          end = Offset(c.x + cos(a) * (inner + maxLen * h), c.y + sin(a) * (inner + maxLen * h)),
                          strokeWidth = outer * 0.085f,
                          cap = StrokeCap.Round
                      )
                  }
                  drawCircle(color, coreR, c)
                  drawCircle(Color.White.copy(alpha = 0.85f), coreR * 0.32f, Offset(c.x - coreR * 0.15f, c.y - coreR * 0.18f))
              }
          }
