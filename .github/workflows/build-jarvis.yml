          /** The main screen: greeting, headline, the Orb, a waveform and four quick chips. */
          @Composable
          fun HomeScreen(
              vm: JarvisViewModel,
              onMenu: () -> Unit,
              onChat: () -> Unit,
              onPermissions: () -> Unit
          ) {
              val accent = LocalAccent.current
              val prefs by vm.prefs.collectAsState()
              val orb by vm.orb.collectAsState()
              val level by vm.level.collectAsState()
              val partial by vm.partial.collectAsState()
              val crash by vm.crash.collectAsState()
              val micOk by rememberGranted(Manifest.permission.RECORD_AUDIO)
              val hindi = prefs.language == "HINDI"
              val mic = rememberMicAction(vm, onStarted = onChat)

              val hour = Calendar.getInstance().get(Calendar.HOUR_OF_DAY)
              val name = prefs.userName.ifBlank { "Ayush" }
              val greeting = if (hindi) {
                  (if (hour < 12) "सुप्रभात" else if (hour < 17) "नमस्कार" else "शुभ संध्या") + ", " + name
              } else {
                  (if (hour < 12) "GOOD MORNING" else if (hour < 17) "GOOD AFTERNOON" else "GOOD EVENING") + ", " + name.uppercase()
              }
              val headline = pick(hindi, "मैं आपकी\nक्या मदद करूँ?", "HOW CAN I\nHELP YOU?")

              val status = when (orb) {
                  OrbState.LISTENING -> pick(hindi, "सुन रहा हूँ", "LISTENING")
                  OrbState.THINKING -> pick(hindi, "सोच रहा हूँ", "THINKING")
                  OrbState.SPEAKING -> pick(hindi, "बोल रहा हूँ", "SPEAKING")
                  OrbState.ERROR -> pick(hindi, "फिर कोशिश कीजिए", "TRY AGAIN")
                  OrbState.IDLE -> pick(hindi, "ऑनलाइन", "ONLINE")
              }
              val caption = when (orb) {
                  OrbState.IDLE -> if (prefs.wakeWord) pick(hindi, "छुएँ या कहें \"Hey Jarvis\"", "TAP TO SPEAK · OR SAY HEY JARVIS") else pick(hindi, "बोलने के लिए छुएँ", "TAP TO SPEAK")
                  OrbState.LISTENING -> if (partial.isNotBlank()) partial else pick(hindi, "सुन रहा हूँ…", "LISTENING…")
                  OrbState.THINKING -> pick(hindi, "सोच रहा हूँ…", "THINKING…")
                  OrbState.SPEAKING -> pick(hindi, "बोल रहा हूँ… रोकने के लिए छुएँ", "SPEAKING… TAP TO STOP")
                  OrbState.ERROR -> pick(hindi, "समझ नहीं आया", "DIDN'T CATCH THAT")
              }

              Column(
                  Modifier
                      .fillMaxSize()
                      .statusBarsPadding()
                      .verticalScroll(rememberScrollState())
                      .padding(start = 16.dp, end = 16.dp, top = 12.dp, bottom = 120.dp),
                  horizontalAlignment = Alignment.CenterHorizontally
              ) {
                  TopBar(Brand.NAME, status, MenuIcon.HAMBURGER, onMenu)

                  Column(Modifier.fillMaxWidth().padding(top = 26.dp)) {
                      Text(greeting, color = accent, style = JT.label, maxLines = 1)
                      Text(
                          headline,
                          color = Color.White,
                          style = JT.heading,
                          lineHeight = 38.sp,
                          modifier = Modifier.padding(top = 6.dp)
                      )
