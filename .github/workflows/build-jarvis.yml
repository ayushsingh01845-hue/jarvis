          // ---------------------------------------------------------------------------- background

          /** Pure black with two soft accent glows and a faint dot grid. */
          @Composable
          fun JarvisBackground(content: @Composable BoxScope.() -> Unit) {
              val accent = LocalAccent.current
              val reduce = LocalReduceMotion.current
              val drift = rememberInfiniteTransition(label = "drift")
              val phaseState = drift.animateFloat(
                  initialValue = 0f,
                  targetValue = (2 * PI).toFloat(),
                  animationSpec = infiniteRepeatable(tween(18000, easing = LinearEasing), RepeatMode.Restart),
                  label = "driftPhase"
              )
              Box(
                  Modifier
                      .fillMaxSize()
                      .background(Color.Black)
                      .drawBehind {
                          // slowly drifting glows: they give the glass something to "refract"
                          val ph = if (reduce) 0f else phaseState.value
                          drawRect(
                              Brush.radialGradient(
                                  colors = listOf(accent.copy(alpha = 0.30f), Color.Transparent),
                                  center = Offset(size.width * (0.95f + 0.07f * cos(ph)), size.height * (0.06f + 0.04f * sin(ph))),
                                  radius = size.maxDimension * 0.55f
                              )
                          )
                          drawRect(
                              Brush.radialGradient(
                                  colors = listOf(accent.copy(alpha = 0.16f), Color.Transparent),
                                  center = Offset(size.width * (0.05f + 0.07f * sin(ph)), size.height * (0.90f + 0.04f * cos(ph))),
                                  radius = size.maxDimension * 0.55f
                              )
                          )
                          drawRect(
                              Brush.radialGradient(
                                  colors = listOf(accent.copy(alpha = 0.10f), Color.Transparent),
                                  center = Offset(size.width * (0.55f + 0.2f * cos(ph + 2f)), size.height * (0.5f + 0.15f * sin(ph + 1f))),
                                  radius = size.maxDimension * 0.4f
                              )
                          )
                      },
              ) {
                  // the dot grid never changes, so it lives in its own layer and is drawn only once
                  Box(
                      Modifier
                          .fillMaxSize()
                          .graphicsLayer { compositingStrategy = CompositingStrategy.Offscreen }
                          .drawBehind {
                              val step = 26.dp.toPx()
                              val radius = 0.8.dp.toPx()
                              var y = 0f
                              while (y < size.height) {
                                  var x = 0f
                                  while (x < size.width) {
                                      drawCircle(Color.White.copy(alpha = 0.05f), radius, Offset(x, y))
                                      x += step
                                  }
                                  y += step
                              }
                          }
                  )
                  content()
              }
          }

          // ---------------------------------------------------------------------------- modifiers

          /** The light edge of liquid glass: bright where the light hits (top left), fading, then a soft glint at the bottom right. */
          private fun rimBrush(rim: Color): Brush {
              fun a(f: Float) = rim.copy(alpha = (rim.alpha * f).coerceIn(0f, 1f))
              return Brush.linearGradient(
                  colors = listOf(a(3.4f), a(0.5f), a(0.2f), a(1.8f)),
                  start = Offset(0f, 0f),
                  end = Offset(900f, 1400f)
              )
          }

          /** Liquid glass: a tinted, slightly curved surface with a bright top highlight and a glowing edge. */
          fun Modifier.glass(shape: Shape, fill: Color = JC.Glass, rim: Color = JC.Rim): Modifier =
              this.clip(shape)
                  .background(
                      Brush.linearGradient(
                          colors = listOf(
                              fill.copy(alpha = (fill.alpha * 2.4f).coerceIn(0f, 1f)),
                              fill,
                              fill.copy(alpha = (fill.alpha * 1.5f).coerceIn(0f, 1f))
                          ),
                          start = Offset(0f, 0f),
                          end = Offset(700f, 1100f)
                      ),
                      shape
                  )
                  .drawBehind {
                      // soft light across the top, like light bending through the glass
                      drawRect(
                          Brush.verticalGradient(
                              listOf(Color.White.copy(alpha = 0.14f), Color.Transparent),
                              startY = 0f,
                              endY = size.height * 0.45f
                          )
                      )
                  }
                  .border(1.dp, rimBrush(rim), shape)

          /** Floating liquid-glass pill (top bar, dock): brighter surface, glowing edge and a soft accent shadow. */
          fun Modifier.glassPill(shape: Shape, accent: Color): Modifier =
              this.shadow(16.dp, shape, ambientColor = accent.copy(alpha = 0.25f), spotColor = accent.copy(alpha = 0.25f))
                  .clip(shape)
                  .background(
                      Brush.verticalGradient(listOf(Color.White.copy(alpha = 0.24f), Color.White.copy(alpha = 0.07f), Color.White.copy(alpha = 0.12f))),
                      shape
                  )
                  .drawBehind {
                      drawRect(
                          Brush.verticalGradient(
                              listOf(Color.White.copy(alpha = 0.22f), Color.Transparent),
                              startY = 0f,
                              endY = size.height * 0.5f
                          )
                      )
                  }
                  .border(1.dp, rimBrush(JC.Rim), shape)

          /** Click with a visible pressed state (shrinks and dims a little). */
          fun Modifier.pressable(enabled: Boolean = true, onClick: () -> Unit): Modifier = composed {
              val source = remember { MutableInteractionSource() }
              val pressed by source.collectIsPressedAsState()
              this
                  .graphicsLayer {
                      val s = if (pressed) 0.96f else 1f
                      scaleX = s
                      scaleY = s
                      alpha = if (pressed) 0.75f else 1f
                  }
                  .clickable(interactionSource = source, indication = null, enabled = enabled, onClick = onClick)
          }

