          package com.jarvis.app.wake

          import android.content.Context
          import java.io.File
          import java.io.FileOutputStream
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.zip.ZipInputStream

          /**
           * The small offline voice model (about 40 MB) used only to catch "Hey Jarvis".
           * It is downloaded once, the first time you switch the wake word on, and then kept on the phone.
           */
          object WakeModel {

              private val urls = listOf(
                  "https://alphacephei.com/vosk/models/vosk-model-small-en-in-0.4.zip",
                  "https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip"
              )

              fun dir(ctx: Context): File = File(ctx.filesDir, "vosk-model")

              fun ready(ctx: Context): Boolean = File(dir(ctx), "ready.flag").exists()

              /** Blocking. Call from a background thread. Returns true when the model is ready. */
              fun download(ctx: Context, onProgress: (Int) -> Unit): Boolean {
                  for (u in urls) {
                      if (tryOne(ctx, u, onProgress)) return true
                  }
                  return false
              }

              private fun tryOne(ctx: Context, url: String, onProgress: (Int) -> Unit): Boolean {
                  val target = dir(ctx)
                  try {
                      target.deleteRecursively()
                      target.mkdirs()
                      val conn = URL(url).openConnection() as HttpURLConnection
                      conn.connectTimeout = 15000
                      conn.readTimeout = 30000
                      conn.instanceFollowRedirects = true
                      if (conn.responseCode != 200) return false
                      val total = conn.contentLengthLong
                      val counter = CountingStream(conn.inputStream, total, onProgress)
                      ZipInputStream(counter).use { zip ->
                          var entry = zip.nextEntry
                          val root = target.canonicalPath
                          while (entry != null) {
                              // drop the top folder name inside the zip
                              val name = entry.name.substringAfter('/', "")
                              if (name.isNotEmpty() && !entry.isDirectory) {
                                  val out = File(target, name)
                                  if (!out.canonicalPath.startsWith(root)) return false
                                  out.parentFile?.mkdirs()
                                  FileOutputStream(out).use { f -> zip.copyTo(f) }
                              }
                              entry = zip.nextEntry
                          }
                      }
                      if (!File(target, "am").exists()) return false
                      File(target, "ready.flag").writeText("ok")
                      onProgress(100)
                      return true
                  } catch (e: Exception) {
                      target.deleteRecursively()
                      return false
                  }
              }

              private class CountingStream(
                  private val inner: java.io.InputStream,
                  private val total: Long,
                  private val onProgress: (Int) -> Unit
              ) : java.io.InputStream() {
                  private var read = 0L
                  private var lastPct = -1

                  private fun bump(n: Int) {
                      if (n > 0 && total > 0) {
                          read += n
                          val pct = ((read * 100) / total).toInt().coerceIn(0, 99)
                          if (pct != lastPct) {
                              lastPct = pct
                              onProgress(pct)
                          }
                      }
                  }

                  override fun read(): Int {
                      val b = inner.read()
                      if (b >= 0) bump(1)
                      return b
                  }

                  override fun read(b: ByteArray, off: Int, len: Int): Int {
                      val n = inner.read(b, off, len)
                      bump(n)
                      return n
                  }

                  override fun close() {
                      inner.close()
                  }
              }
          }
