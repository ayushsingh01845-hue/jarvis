          // ---------------------------------------------------------------------------- waveform

          /** 34 vertical bars. Still when idle, moving with your voice when active. */
          @Composable
          fun Waveform(modifier: Modifier = Modifier, active: Boolean = false, level: Float = 0f, bars: Int = 34) {
              val accent = LocalAccent.current
              val reduce = LocalReduceMotion.current
              val transition = rememberInfiniteTransition(label = "wave")
              val phase by transition.animateFloat(
                  initialValue = 0f,
                  targetValue = (2 * PI).toFloat(),
                  animationSpec = infiniteRepeatable(tween(1400, easing = LinearEasing), RepeatMode.Restart),
                  label = "phase"
              )
              Canvas(modifier.fillMaxWidth().height(34.dp)) {
                  val maxH = 34.dp.toPx()
                  val gap = 4.dp.toPx()
                  val bw = minOf(4.dp.toPx(), (size.width - gap * (bars - 1)) / bars)
                  val total = bars * bw + (bars - 1) * gap
                  val startX = (size.width - total) / 2f
                  val p = if (active && !reduce) phase else 0f
                  for (i in 0 until bars) {
                      val base = 6f + abs(sin(i * 0.7f + p)) * 26f * abs(cos(i * 0.23f)) + 4f
                      val scaled = if (active) 4f + (base - 4f) * (0.3f + 0.7f * level) else base
                      val h = (scaled.dp.toPx()).coerceIn(4.dp.toPx(), maxH)
                      drawRoundRect(
                          color = accent.copy(alpha = (0.4f + 0.6f * (h / maxH)).coerceIn(0f, 1f)),
                          topLeft = Offset(startX + i * (bw + gap), (maxH - h) / 2f),
                          size = Size(bw, h),
                          cornerRadius = CornerRadius(bw / 2f)
                      )
                  }
              }
          }
