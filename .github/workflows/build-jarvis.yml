name: Build Jarvis APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-jarvis
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create the Jarvis app files
        run: |
          rm -rf app/src/main
          cat > .gitignore <<'JARVIS_EOF'
          build/
          .gradle/
          local.properties
          *.iml
          .idea/
          JARVIS_EOF
          mkdir -p "app"
          cat > app/build.gradle.kts <<'JARVIS_EOF'
          import java.io.FileInputStream
          import java.util.Properties

          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.serialization")
          }

          // The Gemini key can be baked in at build time from local.properties (never stored in the repo).
          // In GitHub Actions the workflow writes it there from the secret GEMINI_API_KEY.
          // You can also paste a key inside the app (Settings), which is the easy way.
          val localProps = Properties().apply {
              val f = rootProject.file("local.properties")
              if (f.exists()) load(FileInputStream(f))
          }

          android {
              namespace = "com.jarvis.app"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.jarvis.app"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
                  buildConfigField("String", "GEMINI_API_KEY", "\"${localProps.getProperty("GEMINI_API_KEY", "").trim()}\"")
              }

              buildTypes {
                  debug { isMinifyEnabled = false }
                  release { isMinifyEnabled = false }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures {
                  compose = true
                  buildConfig = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.14"
              }
              packaging {
                  resources {
                      excludes += "/META-INF/{AL2.0,LGPL2.1}"
                  }
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.4")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.4")
              implementation("androidx.activity:activity-compose:1.9.1")

              implementation(platform("androidx.compose:compose-bom:2024.06.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.animation:animation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.navigation:navigation-compose:2.7.7")

              implementation("androidx.datastore:datastore-preferences:1.1.1")
              implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")

              // offline word spotter for "Hey Jarvis"
              implementation("net.java.dev.jna:jna:5.13.0@aar")
              implementation("com.alphacephei:vosk-android:0.3.47")
          }
          JARVIS_EOF
          mkdir -p "app"
          cat > app/proguard-rules.pro <<'JARVIS_EOF'

          JARVIS_EOF
          mkdir -p "app/src/main"
          cat > app/src/main/AndroidManifest.xml <<'JARVIS_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.READ_CONTACTS" />
              <uses-permission android:name="android.permission.CALL_PHONE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="com.android.alarm.permission.SET_ALARM" />
              <uses-permission android:name="android.permission.ACCESS_NOTIFICATION_POLICY" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />

              <uses-feature android:name="android.hardware.camera.flash" android:required="false" />
              <uses-feature android:name="android.hardware.telephony" android:required="false" />

              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
                  <intent>
                      <action android:name="android.speech.RecognitionService" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.TTS_SERVICE" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="https" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.DIAL" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.SENDTO" />
                      <data android:scheme="smsto" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.SET_ALARM" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.SET_TIMER" />
                  </intent>
              </queries>

              <application
                  android:name=".JarvisApplication"
                  android:allowBackup="false"
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.Jarvis">

                  <service
                      android:name=".wake.WakeService"
                      android:exported="false"
                      android:foregroundServiceType="microphone" />

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden|smallestScreenSize|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

              </application>
          </manifest>
          JARVIS_EOF
          mkdir -p "app/src/main/java/com/jarvis/app"
          cat > app/src/main/java/com/jarvis/app/Brand.kt <<'JARVIS_EOF'
          package com.jarvis.app

          /**
           * The one place for branding.
           *
           * To use your own logo: put an image (for example my_logo.png) in app/src/main/res/drawable
           * and set LOGO_RES below to R.drawable.my_logo. It will replace the big "J" in the Orb,
           * the avatar and the splash screen.
           */
          object Brand {
              const val NAME = "JARVIS"
              const val LETTER = "J"
              val LOGO_RES: Int? = null
          }
          JARVIS_EOF
          mkdir -p "app/src/main/java/com/jarvis/app"
          cat > app/src/main/java/com/jarvis/app/JarvisApplication.kt <<'JARVIS_EOF'
          package com.jarvis.app

          import android.app.Application
          import java.io.File
          import java.io.PrintWriter
          import java.io.StringWriter

          /**
           * App start-up. Its only job: if the app ever crashes, save the error text to a file
           * so the next launch can show it on the Home screen (you can screenshot it).
           */
          class JarvisApplication : Application() {
              override fun onCreate() {
                  super.onCreate()
                  com.jarvis.app.voice.Listener.restoreSound(this)
                  val previous = Thread.getDefaultUncaughtExceptionHandler()
                  Thread.setDefaultUncaughtExceptionHandler { thread, error ->
                      try {
                          val sw = StringWriter()
                          error.printStackTrace(PrintWriter(sw))
                          File(filesDir, CRASH_FILE).writeText(sw.toString().take(1800))
                      } catch (_: Throwable) {
                      }
                      previous?.uncaughtException(thread, error)
                  }
              }

              companion object {
                  const val CRASH_FILE = "last_crash.txt"
              }
          }
          JARVIS_EOF
          mkdir -p "app/src/main/java/com/jarvis/app"
          cat > app/src/main/java/com/jarvis/app/JarvisViewModel.kt <<'JARVIS_EOF'
          package com.jarvis.app

          import android.app.Application
          import android.os.Handler
          import android.os.Looper
          import android.speech.SpeechRecognizer
          import androidx.datastore.preferences.core.Preferences
          import androidx.lifecycle.AndroidViewModel
          import androidx.lifecycle.viewModelScope
          import com.jarvis.app.brain.Act
          import com.jarvis.app.brain.ActionCard
          import com.jarvis.app.brain.ActionRunner
          import com.jarvis.app.brain.CardTap
          import com.jarvis.app.brain.Gemini
          import com.jarvis.app.brain.LangUtil
          import com.jarvis.app.brain.Norm
          import com.jarvis.app.brain.RLang
          import com.jarvis.app.brain.Router
          import com.jarvis.app.brain.tr
          import com.jarvis.app.data.K
          import com.jarvis.app.data.Note
          import com.jarvis.app.data.Prefs
          import com.jarvis.app.data.PrefsRepo
          import com.jarvis.app.voice.Listener
          import com.jarvis.app.voice.Speaker
          import com.jarvis.app.wake.WakeBus
          import com.jarvis.app.wake.WakeControl
          import com.jarvis.app.wake.WakeModel
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import kotlinx.coroutines.Job
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.flow.MutableSharedFlow
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.SharedFlow
          import kotlinx.coroutines.flow.SharingStarted
          import kotlinx.coroutines.flow.StateFlow
          import kotlinx.coroutines.flow.asSharedFlow
          import kotlinx.coroutines.flow.asStateFlow
          import kotlinx.coroutines.flow.stateIn
          import kotlinx.coroutines.launch
          import java.io.File

          enum class OrbState { IDLE, LISTENING, THINKING, SPEAKING, ERROR }

          data class ChatMessage(
              val id: Long,
              val fromUser: Boolean,
              val text: String,
              val card: ActionCard? = null
          )

          /**
           * The conductor. For every sentence it: listens -> asks the local router -> (if not understood)
           * asks Gemini -> runs the action -> shows the answer -> speaks it.
           */
          class JarvisViewModel(app: Application) : AndroidViewModel(app) {

              private val repo = PrefsRepo(app)
              private val runner = ActionRunner(app, repo)
              private val main = Handler(Looper.getMainLooper())

              val prefs: StateFlow<Prefs> = repo.prefs.stateIn(viewModelScope, SharingStarted.Eagerly, Prefs())
              val notes: StateFlow<List<Note>> = repo.notes.stateIn(viewModelScope, SharingStarted.Eagerly, emptyList())

              private val _messages = MutableStateFlow<List<ChatMessage>>(emptyList())
              val messages: StateFlow<List<ChatMessage>> = _messages.asStateFlow()

              private val _orb = MutableStateFlow(OrbState.IDLE)
              val orb: StateFlow<OrbState> = _orb.asStateFlow()

              private val _level = MutableStateFlow(0f)
              val level: StateFlow<Float> = _level.asStateFlow()

              private val _partial = MutableStateFlow("")
              val partial: StateFlow<String> = _partial.asStateFlow()

              private val _crash = MutableStateFlow<String?>(null)
              val crash: StateFlow<String?> = _crash.asStateFlow()

              /** "" = nothing going on, "12" = downloading the voice model (percent), "ERROR" = download failed. */
              private val _wakeStatus = MutableStateFlow("")
              val wakeStatus: StateFlow<String> = _wakeStatus.asStateFlow()

              /** Asks the screen to open the phone's own voice window (used when the built-in listener keeps failing). */
              private val _systemVoice = MutableSharedFlow<String>(extraBufferCapacity = 1)
              val systemVoice: SharedFlow<String> = _systemVoice.asSharedFlow()

              private val _mood = MutableStateFlow(Mood.NEUTRAL)
              val mood: StateFlow<Mood> = _mood.asStateFlow()
              private var moodJob: Job? = null

              private var retried = false
              private var lastTag = "hi-IN"

              private var nextId = 1L
              private var work: Job? = null
              private var callJob: Job? = null

              private val listener = Listener(app)
              private val speaker = Speaker(app) { speaking ->
                  main.post {
                      if (speaking) {
                          _orb.value = OrbState.SPEAKING
                      } else if (_orb.value == OrbState.SPEAKING) {
                          _orb.value = OrbState.IDLE
                      }
                  }
              }

              init {
                  viewModelScope.launch {
                      _orb.collect { WakeBus.markBusy(it != OrbState.IDLE) }
                  }
                  val f = File(app.filesDir, JarvisApplication.CRASH_FILE)
                  if (f.exists()) {
                      _crash.value = try {
                          f.readText()
                      } catch (e: Exception) {
                          null
                      }
                  }
                  listener.onPartial = { _partial.value = it }
                  listener.onLevel = { _level.value = it }
                  listener.onResult = { options ->
                      _partial.value = ""
                      _level.value = 0f
                      heard(options)
                  }
                  listener.onError = { code ->
                      _partial.value = ""
                      _level.value = 0f
                      if ((code == 11 || code == 8) && !retried && _orb.value == OrbState.LISTENING) {
                          // the phone's speech service dropped out for a moment: try once more
                          retried = true
                          main.postDelayed({
                              if (_orb.value == OrbState.LISTENING) {
                                  try {
                                      listener.start(lastTag)
                                  } catch (e: Exception) {
                                      _orb.value = OrbState.IDLE
                                  }
                              }
                          }, 600)
                      } else if ((code == 11 || code == 8) && _orb.value == OrbState.LISTENING) {
                          // still failing: let the phone's own voice window do the listening
                          _systemVoice.tryEmit(lastTag)
                      } else when (code) {
                          SpeechRecognizer.ERROR_NO_MATCH, SpeechRecognizer.ERROR_SPEECH_TIMEOUT -> problem(currentLang(), noHear = true)
                          SpeechRecognizer.ERROR_INSUFFICIENT_PERMISSIONS -> micDenied()
                          SpeechRecognizer.ERROR_NETWORK, SpeechRecognizer.ERROR_NETWORK_TIMEOUT, SpeechRecognizer.ERROR_SERVER ->
                              problem(currentLang(), noHear = false, text = netText())
                          SpeechRecognizer.ERROR_CLIENT -> _orb.value = OrbState.IDLE
                          else -> problem(currentLang(), noHear = false, text = voiceFailText(code))
                      }
                  }
              }

              // ------------------------------------------------------------------ language helpers

              private fun currentLang(): RLang = when (prefs.value.language) {
                  "HINDI" -> RLang.HI
                  "ENGLISH" -> RLang.EN
                  else -> RLang.HING
              }

              private fun netText() = tr(
                  currentLang(),
                  "आवाज़ पहचानने के लिए इंटरनेट चाहिए। कनेक्शन जाँचिए।",
                  "Awaaz pehchanne ke liye internet chahiye. Connection check karo.",
                  "Voice recognition needs internet. Please check your connection."
              )

              private fun voiceFailText(code: Int) = tr(
                  currentLang(),
                  "आवाज़ पहचानने में दिक्कत आई (कोड $code)। आप लिखकर भी पूछ सकते हैं।",
                  "Awaaz pehchanne me dikkat aayi (code $code). Aap likhkar bhi pooch sakte ho.",
                  "Voice recognition had a problem (code $code). You can type instead."
              )

              // ------------------------------------------------------------------ listening

              /** Returns false if this phone has no voice recognition. */
              fun startListening(): Boolean {
                  if (!listener.available()) {
                      addMessage(
                          false,
                          tr(
                              currentLang(),
                              "इस फ़ोन में आवाज़ पहचानने वाली सेवा नहीं है। आप लिखकर पूछ सकते हैं।",
                              "Is phone me awaaz pehchanne wali service nahi hai. Aap likhkar pooch sakte ho.",
                              "This phone has no voice recognition service. You can type instead."
                          )
                      )
                      return false
                  }
                  speaker.stop()
                  work?.cancel()
                  _partial.value = ""
                  _orb.value = OrbState.LISTENING
                  val tag = if (prefs.value.language == "ENGLISH") "en-IN" else "hi-IN"
                  lastTag = tag
                  retried = false
                  // if the background "Hey Jarvis" listener is running, give it a moment to let go of the microphone
                  val delayMs = if (WakeBus.active) 450L else 0L
                  WakeBus.markBusy(true)
                  main.postDelayed({
                      if (_orb.value == OrbState.LISTENING) {
                          try {
                              listener.start(tag)
                          } catch (e: Exception) {
                              _orb.value = OrbState.IDLE
                          }
                      }
                  }, delayMs)
                  return true
              }

              /** The recognizer gives several guesses: prefer the first one Jarvis can act on. */
              private fun heard(options: List<String>) {
                  val best = options.firstOrNull { it.isNotBlank() && Router.route(it) != null }
                      ?: options.firstOrNull { it.isNotBlank() }
                      ?: ""
                  if (best.isBlank()) problem(RLang.HING, noHear = true) else submit(best)
              }

              /** Result from the phone's own voice window. An empty list means it was closed without speaking. */
              fun onSystemVoice(options: List<String>) {
                  _partial.value = ""
                  _level.value = 0f
                  if (options.isEmpty()) {
                      _orb.value = OrbState.IDLE
                  } else {
                      heard(options)
                  }
              }

              /** You finished talking (tapped the orb or the mic again). */
              fun finishListening() {
                  listener.finish()
              }

              fun stopSpeaking() {
                  speaker.stop()
                  if (_orb.value == OrbState.SPEAKING) _orb.value = OrbState.IDLE
              }

              fun micDenied() {
                  _orb.value = OrbState.IDLE
                  addMessage(
                      false,
                      tr(
                          currentLang(),
                          "माइक्रोफ़ोन की अनुमति नहीं मिली। आप लिखकर पूछ सकते हैं, या Permissions स्क्रीन में अनुमति दे दीजिए।",
                          "Microphone ki permission nahi mili. Aap likhkar pooch sakte ho, ya Permissions screen me permission de do.",
                          "Microphone permission was declined. You can type, or allow it on the Permissions screen."
                      ),
                      ActionCard("ALLOW", "MICROPHONE", "Tap to open permissions", CardTap.PERMISSIONS)
                  )
              }

              private fun problem(l: RLang, noHear: Boolean, text: String? = null) {
                  flashError()
                  val msg = text ?: if (noHear) tr(
                      l,
                      "कुछ सुनाई नहीं दिया। फिर से बोलिए।",
                      "Kuch sunayi nahi diya. Phir se boliye.",
                      "I didn't catch that. Please say it again."
                  ) else ""
                  if (msg.isNotEmpty()) addMessage(false, msg)
              }

              private fun flashError() {
                  _orb.value = OrbState.ERROR
                  viewModelScope.launch {
                      delay(700)
                      if (_orb.value == OrbState.ERROR) _orb.value = OrbState.IDLE
                  }
              }

              // ------------------------------------------------------------------ thinking

              /** Show a feeling on the face for a few seconds, then go back to neutral. */
              private fun showMood(m: Mood, holdMs: Long = 7000) {
                  _mood.value = m
                  moodJob?.cancel()
                  if (m != Mood.NEUTRAL) {
                      moodJob = viewModelScope.launch {
                          delay(holdMs)
                          _mood.value = Mood.NEUTRAL
                      }
                  }
              }

              private fun addMessage(fromUser: Boolean, text: String, card: ActionCard? = null) {
                  val m = ChatMessage(nextId++, fromUser, text, card)
                  _messages.value = _messages.value + m
              }

              /** Send one sentence (typed, tapped from a chip, or heard). */
              fun submit(raw: String) {
                  val text = raw.trim()
                  if (text.isEmpty()) return
                  speaker.stop()
                  work?.cancel()
                  val earlier = _messages.value.takeLast(6).map { Pair(it.fromUser, it.text) }
                  addMessage(true, text)
                  MoodRead.fromUser(text)?.let { showMood(it, 5000) }
                  _orb.value = OrbState.THINKING
                  work = viewModelScope.launch { process(text, earlier) }
              }

              private suspend fun process(text: String, earlier: List<Pair<Boolean, String>>) {
                  val p = prefs.value
                  val l = LangUtil.detect(text, p.language)
                  var reply = ""
                  var card: ActionCard? = null
                  var pending: com.jarvis.app.brain.PendingCall? = null
                  var feeling: Mood? = null

                  val key = p.apiKey.ifBlank { BuildConfig.GEMINI_API_KEY }
                  // a long, chatty sentence is better understood by Gemini than by keyword matching
                  val longTalk = key.isNotBlank() && Norm.tokens(text).size > 7
                  val local = if (longTalk) null else Router.route(text)
                  if (local != null) {
                      val out = runner.run(local, l, p)
                      reply = out.reply ?: tr(l, "ठीक है।", "Theek hai.", "Okay.")
                      card = out.card
                      pending = out.pendingCall
                      feeling = if (out.ok) Mood.HAPPY else Mood.SAD
                  } else {
                      if (key.isBlank()) {
                          reply = tr(
                              l,
                              "स्मार्ट जवाब अभी बंद हैं, क्योंकि Gemini की कुंजी नहीं डाली गई। Settings में कुंजी डाल दीजिए। सीधे कमांड, जैसे अलार्म या कॉल, बिना कुंजी के भी चलते हैं।",
                              "Smart jawab abhi band hain, kyunki Gemini ki key nahi daali gayi. Settings me key daal do. Seedhe commands, jaise alarm ya call, bina key ke bhi chalte hain.",
                              "Smart answers are off because no Gemini key is set. Add one in Settings. Direct commands like alarms and calls still work without it."
                          )
                          card = ActionCard("KEY", "SETTINGS", "Smart answers are off", CardTap.NONE)
                      } else {
                          try {
                              val g = Gemini.ask(key, p.userName.ifBlank { "Ayush" }, p.language, earlier, text, p.geminiModel)
                              if (g.model.isNotEmpty() && g.model != p.geminiModel) set(K.geminiModel, g.model)
                              feeling = MoodRead.fromKey(g.emotion)
                              if (g.act is Act.None) {
                                  reply = g.text
                              } else {
                                  val out = runner.run(g.act, l, p)
                                  reply = if (out.ok) g.text else (out.reply ?: g.text)
                                  card = out.card
                                  pending = out.pendingCall
                              }
                          } catch (e: Gemini.GeminiError) {
                              reply = geminiProblem(e, l)
                          } catch (e: java.io.IOException) {
                              reply = tr(
                                  l,
                                  "इंटरनेट नहीं है, इसलिए स्मार्ट जवाब नहीं दे पा रहा। सीधे कमांड अब भी चलते हैं।",
                                  "Internet nahi hai, isliye smart jawab nahi de pa raha. Seedhe commands ab bhi chalte hain.",
                                  "There's no internet, so I can't give smart answers. Direct commands still work."
                              )
                          } catch (e: Exception) {
                              reply = tr(
                                  l,
                                  "कुछ गड़बड़ हो गई। (${e.javaClass.simpleName})",
                                  "Kuch gadbad ho gayi. (${e.javaClass.simpleName})",
                                  "Something went wrong. (${e.javaClass.simpleName})"
                              )
                          }
                      }
                  }

                  if (feeling != null) showMood(feeling, 7000)
                  finish(reply, card, pending, p)
              }

              private fun geminiProblem(e: Gemini.GeminiError, l: RLang): String {
                  val extra = if (e.detail.isNotEmpty()) " [" + e.detail + "]" else ""
                  return when (e.code) {
                      "nokey" -> tr(
                          l,
                          "Gemini की कुंजी काम नहीं कर रही। Settings में नई कुंजी डालिए।",
                          "Gemini ki key kaam nahi kar rahi. Settings me nayi key daalo.",
                          "The Gemini key isn't working. Please paste a new one in Settings."
                      )
                      "rate" -> tr(
                          l,
                          "अभी बहुत अनुरोध हो गए हैं। थोड़ी देर बाद फिर कोशिश कीजिए।",
                          "Abhi bahut requests ho gayi hain. Thodi der baad phir try karo.",
                          "Too many requests right now. Please try again in a little while."
                      ) + extra
                      else -> tr(
                          l,
                          "स्मार्ट जवाब अभी नहीं मिल पाया।",
                          "Smart jawab abhi nahi mil paya.",
                          "I couldn't get a smart answer right now."
                      ) + extra
                  }
              }

              private fun finish(reply: String, card: ActionCard?, pending: com.jarvis.app.brain.PendingCall?, p: Prefs) {
                  addMessage(false, reply, card)
                  var speaking = false
                  if (p.speakAloud) speaking = speaker.speak(reply, p.speed, p.maleVoice, p.voiceHi, p.voiceEn, p.pitch)
                  if (!speaking) _orb.value = OrbState.IDLE
                  // else: the Speaker callback switches the orb to SPEAKING and back to IDLE

                  if (pending != null) {
                      callJob?.cancel()
                      callJob = viewModelScope.launch {
                          delay(3000)
                          val ok = runner.callNow(pending.number)
                          if (!ok) setCallCard(ActionCard("DIAL", pending.name.uppercase(), pending.number)) else setCallCard(null)
                      }
                  }
              }

              /** Tap on "CALLING ... Tap to cancel". */
              fun cancelCall() {
                  callJob?.cancel()
                  setCallCard(ActionCard("CANCELLED", "CALL", "Not called"))
              }

              private fun setCallCard(newCard: ActionCard?) {
                  _messages.value = _messages.value.map { m ->
                      val c = m.card
                      if (c != null && c.tap == CardTap.CANCEL_CALL) {
                          m.copy(card = newCard ?: ActionCard("CALLING", c.small, "Calling now"))
                      } else {
                          m
                      }
                  }
              }

              // ------------------------------------------------------------------ settings, notes, misc

              fun <T> set(key: Preferences.Key<T>, value: T) {
                  viewModelScope.launch { repo.set(key, value) }
              }

              /** Switch the "Hey Jarvis" listener on or off. The first time it downloads a small voice model. */
              fun setWake(enabled: Boolean) {
                  val app = getApplication<Application>()
                  if (!enabled) {
                      viewModelScope.launch { repo.set(K.wakeWord, false) }
                      WakeControl.stop(app)
                      _wakeStatus.value = ""
                      return
                  }
                  viewModelScope.launch {
                      if (!WakeModel.ready(app)) {
                          _wakeStatus.value = "0"
                          val ok = withContext(Dispatchers.IO) {
                              WakeModel.download(app) { pct -> _wakeStatus.value = pct.toString() }
                          }
                          if (!ok) {
                              _wakeStatus.value = "ERROR"
                              return@launch
                          }
                          _wakeStatus.value = ""
                      }
                      repo.set(K.wakeWord, true)
                      WakeControl.start(app)
                  }
              }

              /** Called when the app opens: bring the listener back if it was switched on. */
              fun resumeWake() {
                  val app = getApplication<Application>()
                  if (prefs.value.wakeWord && WakeModel.ready(app) && !WakeBus.active) WakeControl.start(app)
              }

              /** The voices this phone offers for "hi" or "en". */
              fun voiceChoices(lang: String): List<Pair<String, String>> = speaker.voices(lang)

              /** Say a short sample so you can hear a voice choice. */
              fun previewVoice(hindi: Boolean, voiceHi: String, voiceEn: String, pitch: Float) {
                  val p = prefs.value
                  val sample = if (hindi) "नमस्ते, मैं जार्विस हूँ। बोलिए, क्या करना है?" else "Hey, it's Jarvis. What are we doing?"
                  speaker.speak(sample, p.speed, p.maleVoice, voiceHi, voiceEn, pitch)
              }

              fun addNote(text: String) {
                  if (text.isBlank()) return
                  viewModelScope.launch { repo.addNote(text.trim()) }
              }

              fun deleteNote(id: Long) {
                  viewModelScope.launch { repo.deleteNote(id) }
              }

              fun clearHistory() {
                  work?.cancel()
                  callJob?.cancel()
                  speaker.stop()
                  _messages.value = emptyList()
                  _orb.value = OrbState.IDLE
              }

              fun dismissCrash() {
                  try {
                      File(getApplication<Application>().filesDir, JarvisApplication.CRASH_FILE).delete()
                  } catch (e: Exception) {
                  }
                  _crash.value = null
              }

              override fun onCleared() {
                  listener.destroy()
                  speaker.shutdown()
                  super.onCleared()
              }
          }
