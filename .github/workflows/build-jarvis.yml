                      color = JC.Dim,
                      style = JT.label.copy(letterSpacing = 3.sp, fontSize = 11.sp),
                      textAlign = TextAlign.Center,
                      maxLines = 2
                  )
                  Spacer(Modifier.height(16.dp))
                  Waveform(active = orb == OrbState.LISTENING || orb == OrbState.SPEAKING, level = if (orb == OrbState.LISTENING) level else 0.5f)
                  Spacer(Modifier.height(20.dp))

                  FlowRow(
                      Modifier.fillMaxWidth(),
                      horizontalArrangement = Arrangement.spacedBy(8.dp, Alignment.CenterHorizontally),
                      verticalArrangement = Arrangement.spacedBy(8.dp)
                  ) {
                      val chips = if (hindi) listOf(
                          Triple("अलार्म", "सुबह 7 बजे", "सुबह 7 बजे का अलार्म लगाओ"),
                          Triple("कॉल", "मम्मी को", "मम्मी को कॉल करो"),
                          Triple("संगीत", "गाना चलाओ", "गाना चलाओ"),
                          Triple("टॉर्च", "चालू करो", "टॉर्च चालू करो")
                      ) else listOf(
                          Triple("ALARM", "Wake me at 7", "Set an alarm for 7 AM"),
                          Triple("CALL", "Call Mummy", "Call Mummy"),
                          Triple("MUSIC", "Play music", "Play music"),
                          Triple("TORCH", "Turn on", "Turn on the torch")
                      )
                      for (chip in chips) {
                          TagChip(chip.first, chip.second) {
                              vm.submit(chip.third)
                              onChat()
                          }
                      }
                  }

                  if (!micOk) {
                      Spacer(Modifier.height(16.dp))
                      NoticeCard(
                          tag = pick(hindi, "माइक बंद", "MIC OFF"),
                          text = pick(hindi, "बोलने के लिए माइक्रोफ़ोन की अनुमति दीजिए।", "Allow the microphone so you can talk to me."),
                          action = pick(hindi, "अनुमति", "ALLOW"),
                          onAction = onPermissions
                      )
                  }

                  val crashText = crash
                  if (crashText != null) {
                      Spacer(Modifier.height(16.dp))
                      CrashCard(crashText, hindi, onDismiss = { vm.dismissCrash() })
                  }
              }
          }

          /** A small glass card with a tag, one line of text and a button. */
          @Composable
          fun NoticeCard(tag: String, text: String, action: String, onAction: () -> Unit) {
              val accent = LocalAccent.current
              Row(
                  Modifier
                      .fillMaxWidth()
                      .glass(RoundedCornerShape(22.dp))
                      .padding(14.dp),
                  verticalAlignment = Alignment.CenterVertically,
                  horizontalArrangement = Arrangement.spacedBy(12.dp)
              ) {
                  Column(Modifier.weight(1f)) {
                      Text(tag, color = accent, style = JT.tiny)
                      Text(text, color = Color.White, fontFamily = Inter, fontSize = 13.sp, modifier = Modifier.padding(top = 2.dp))
                  }
                  GlassButton(action, onAction, filled = true)
              }
          }

          /** Shown on the next launch after the app crashed, so the reason can be read and shared. */
          @Composable
          fun CrashCard(text: String, hindi: Boolean, onDismiss: () -> Unit) {
              val clipboard = LocalClipboardManager.current
              Column(
                  Modifier
                      .fillMaxWidth()
                      .glass(RoundedCornerShape(22.dp), rim = JC.Red.copy(alpha = 0.6f))
                      .padding(14.dp),
                  verticalArrangement = Arrangement.spacedBy(8.dp)
              ) {
                  Text(pick(hindi, "पिछली बार ऐप बंद हो गया था", "THE APP CLOSED UNEXPECTEDLY LAST TIME"), color = JC.Red, style = JT.tiny)
                  Box(Modifier.fillMaxWidth()) {
                      Text(text.take(500), color = JC.Dim, fontFamily = Mono, fontSize = 10.sp, maxLines = 8)
                  }
                  Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      GlassButton(pick(hindi, "कॉपी", "COPY"), { clipboard.setText(AnnotatedString(text)) })
                      GlassButton(pick(hindi, "हटाएँ", "DISMISS"), onDismiss)
                  }
              }
          }
