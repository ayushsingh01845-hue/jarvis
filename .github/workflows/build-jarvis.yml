          package com.jarvis.app.brain

          import java.util.Calendar

          /**
           * The local router: understands simple commands in Hindi, English and Hinglish with NO internet.
           * route() returns an Act when it understood the sentence, or null when it should ask Gemini.
           */
          object Router {

              private val dateStrict = Norm.set("date", "तारीख", "tareekh", "tarikh", "तारिख")
              private val dayWords = Norm.set("din", "दिन", "day")
              private val timeQuestion = Norm.set("kitne", "कितने", "kitna", "कितना", "what", "kya", "क्या")

              fun route(raw: String): Act? {
                  val tokens = Norm.tokens(raw)
                  if (tokens.isEmpty()) return null
                  fun has(set: Set<String>) = tokens.any { it in set }

                  // 1. timers
                  if (has(P.timer) || (has(P.minUnits + P.secUnits + P.hourUnits) && has(P.alarm).not() && has(P.reminder).not() && has(P.note).not() && timerSeconds(tokens) != null && tokens.size <= 5)) {
                      val secs = timerSeconds(tokens)
                      return if (secs != null) Act.Timer(secs) else Act.Ask("timer_len")
                  }

                  // 2. things Jarvis answers by itself
                  if (has(P.battery)) return Act.Info("battery")
                  if (has(dateStrict) || (has(dayWords) && has(P.what))) return Act.Info("date")
                  if (has(P.timeWord) && has(timeQuestion)) return Act.Info("time")
                  if (has(P.baje) && has(Norm.set("kitne", "कितने", "kya", "क्या")) && parseTime(tokens) == null) return Act.Info("time")

                  // 3. reminder and alarm
                  if (has(P.reminder)) {
                      val t = parseTime(tokens)
                      val body = bodyAfterThat(tokens, P.reminder + P.alarm + P.baje + P.amWords + P.pmWords + P.nightWords)
                      return if (t != null) Act.Alarm(t.first, t.second, body) else Act.Note(body)
                  }
                  if (has(P.alarm)) {
                      val t = parseTime(tokens)
                      return if (t != null) Act.Alarm(t.first, t.second) else Act.Ask("alarm_time")
                  }

                  // 4. torch and volume
                  if (has(P.torch) && !has(P.music)) return Act.Torch(on = !has(P.off))
                  if (has(P.volume)) {
                      val mode = when {
                          has(P.volMute) -> "mute"
                          has(P.volMax) -> "max"
                          has(P.volDown) -> "down"
                          has(P.volUp) -> "up"
                          else -> "up"
                      }
                      return Act.Volume(mode)
                  }

                  // 5. messages and calls
                  if (has(P.sms)) {
                      val idx = tokens.indexOfFirst { it in P.that }
                      val text = if (idx >= 0) tokens.drop(idx + 1).joinToString(" ") else ""
                      val head = if (idx >= 0) tokens.take(idx) else tokens
                      val name = head.filter { it !in P.sms && it !in P.filler }.joinToString(" ")
                      return Act.Sms(name, text)
                  }
                  val phoneCall = has(P.phoneWord) && has(P.phoneVerbs) && !has(P.inWords) && tokens.size <= 5
                  if (has(P.call) || phoneCall) {
                      val name = tokens.filter { it !in P.call && it !in P.phoneWord && it !in P.filler }.joinToString(" ")
                      return if (name.isBlank()) Act.Ask("call_who") else Act.Call(name)
                  }

                  // 6. notes
                  if (has(P.note)) {
                      val body = bodyAfterThat(tokens, P.noteNoise + P.filler)
                      return if (body.isBlank()) Act.Ask("note_text") else Act.Note(body)
                  }

                  // 7a. "play ... on YouTube" -> search on YouTube; a complaint like "you are not playing" -> ask Gemini
                  if (has(P.neg) && (has(P.music) || has(P.play) || has(P.open) || has(P.yt))) return null
                  if (has(P.yt) && (has(P.open) || has(P.play) || has(P.music))) {
                      val rest = tokens.filter { it !in P.yt && it !in P.open && it !in P.play && it !in P.filler && it !in P.search }.joinToString(" ")
                      if (rest.isNotBlank()) return Act.Music("yt:" + rest)
                  }

                  // 7. music
                  if (has(P.music) || (has(P.play) && !has(P.open))) {
                      val query = tokens.filter { it !in P.music && it !in P.play && it !in P.filler && it !in P.open && it !in P.search }.joinToString(" ")
                      return Act.Music(query)
                  }

                  // 8. open an app
                  if (has(P.open)) {
                      val name = tokens.filter { it !in P.open && it !in P.filler }.joinToString(" ")
                      return if (name.isBlank()) Act.Ask("app_name") else Act.OpenApp(name)
                  }

                  // 9. web search
                  if (has(P.search)) {
                      val q = tokens.filter { it !in P.search && it !in P.filler }.joinToString(" ")
                      if (q.isNotBlank()) return Act.WebSearch(q)
                  }

                  return null
              }

              /** Text after "ki" / "that" if present, otherwise all words except the noise words. */
              private fun bodyAfterThat(tokens: List<String>, noise: Set<String>): String {
                  val idx = tokens.indexOfFirst { it in P.that }
                  val source = if (idx >= 0) tokens.drop(idx + 1) else tokens
                  return source.filter { it !in noise && it.toIntOrNull() == null && !it.contains(':') }.joinToString(" ")
              }

              private fun number(token: String): Int? = token.toIntOrNull() ?: P.numberWords[token]

              /** "10 minute", "1 ghanta 30 minute", "aadha ghanta", "paanch minute" -> seconds. */
              fun timerSeconds(tokens: List<String>): Int? {
                  var total = 0.0
                  var found = false
                  for (i in tokens.indices) {
                      val unit = tokens[i]
                      val mult = when {
                          unit in P.secUnits -> 1.0
                          unit in P.minUnits -> 60.0
                          unit in P.hourUnits -> 3600.0
                          else -> 0.0
                      }
                      if (mult == 0.0 || i == 0) continue
                      val prev = tokens[i - 1]
                      val n = prev.toDoubleOrNull() ?: P.fraction[prev] ?: number(prev)?.toDouble() ?: continue
                      total += n * mult
                      found = true
                  }
                  val s = total.toInt()
                  return if (found && s > 0) s else null
              }

              /** "6 baje", "6:30", "saadhe 6 baje", "shaam 5 baje", "6 pm" -> hour (0-23) and minute. */
              fun parseTime(tokens: List<String>): Pair<Int, Int>? {
                  var h: Int? = null
                  var m = 0

                  // "6:30" or "6.30"
                  val joined = tokens.joinToString(" ")
                  val clock = Regex("(\\d{1,2})[:.](\\d{2})").find(joined)
                  if (clock != null) {
                      h = clock.groupValues[1].toInt()
                      m = clock.groupValues[2].toInt()
                  }

                  // "dedh baje" (1:30) and "dhai baje" (2:30)
                  if (h == null) {
                      val i = tokens.indexOfFirst { it in P.dedh || it in P.dhai }
                      if (i >= 0 && tokens.getOrNull(i + 1) in P.baje) {
                          if (tokens[i] in P.dedh) { h = 1; m = 30 } else { h = 2; m = 30 }
                      }
                  }

                  // "[saadhe/sava/paune] 6 baje" or "6 pm"
                  if (h == null) {
                      for (i in tokens.indices) {
                          val n = number(tokens[i]) ?: continue
                          if (n !in 0..24) continue
                          val next = tokens.getOrNull(i + 1)
                          val prev = tokens.getOrNull(i - 1)
                          val timey = (next != null && (next in P.baje || next in P.amWords || next in P.pmWords)) ||
                              (prev != null && (prev in P.saadhe || prev in P.sava || prev in P.paune))
                          if (!timey) continue
                          h = n
                          when {
                              prev != null && prev in P.saadhe -> m = 30
                              prev != null && prev in P.sava -> m = 15
                              prev != null && prev in P.paune -> { h = if (n - 1 <= 0) 12 else n - 1; m = 45 }
                          }
                          break
                      }
                  }

                  val base = h ?: return null
                  if (base !in 0..24 || m !in 0..59) return null
                  var hour = base % 24

                  val pm = tokens.any { it in P.pmWords }
                  val am = tokens.any { it in P.amWords }
                  val night = tokens.any { it in P.nightWords }
                  when {
                      pm -> if (hour < 12) hour += 12
                      am -> if (hour == 12) hour = 0
                      night -> if (hour in 6..11) hour += 12 else if (hour == 12) hour = 0
                      hour in 1..12 -> {
                          // No am/pm said: pick whichever comes next from now.
                          val now = Calendar.getInstance()
                          val nowMin = now.get(Calendar.HOUR_OF_DAY) * 60 + now.get(Calendar.MINUTE)
                          val amMin = (hour % 12) * 60 + m
                          val pmMin = amMin + 12 * 60
                          hour = when {
                              amMin > nowMin -> hour % 12
                              pmMin > nowMin -> hour % 12 + 12
                              else -> hour % 12
                          }
                      }
                  }
                  return Pair(hour, m)
              }
          }
