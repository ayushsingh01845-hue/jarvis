          package com.jarvis.app.data

          import android.content.Context
          import androidx.datastore.core.DataStore
          import androidx.datastore.preferences.core.Preferences
          import androidx.datastore.preferences.core.booleanPreferencesKey
          import androidx.datastore.preferences.core.edit
          import androidx.datastore.preferences.core.floatPreferencesKey
          import androidx.datastore.preferences.core.stringPreferencesKey
          import androidx.datastore.preferences.preferencesDataStore
          import kotlinx.coroutines.flow.Flow
          import kotlinx.coroutines.flow.map
          import kotlinx.serialization.Serializable
          import kotlinx.serialization.decodeFromString
          import kotlinx.serialization.encodeToString
          import kotlinx.serialization.json.Json

          /** Everything is stored on the phone, in this one small store. */
          val Context.jarvisStore: DataStore<Preferences> by preferencesDataStore(name = "jarvis")

          /** The keys of every saved setting. */
          object K {
              val language = stringPreferencesKey("language")      // HINDI, ENGLISH, AUTO
              val speakAloud = booleanPreferencesKey("speak_aloud")
              val speed = floatPreferencesKey("speed")
              val accent = stringPreferencesKey("accent")
              val userName = stringPreferencesKey("user_name")
              val apiKey = stringPreferencesKey("api_key")
              val callDirect = booleanPreferencesKey("call_direct")
              val skillAlarms = booleanPreferencesKey("skill_alarms")
              val skillCalls = booleanPreferencesKey("skill_calls")
              val skillApps = booleanPreferencesKey("skill_apps")
              val skillMusic = booleanPreferencesKey("skill_music")
              val skillDevice = booleanPreferencesKey("skill_device")
              val skillNotes = booleanPreferencesKey("skill_notes")
              val skillWeb = booleanPreferencesKey("skill_web")
              val notes = stringPreferencesKey("notes_json")
              val wakeWord = booleanPreferencesKey("wake_word")
              val maleVoice = booleanPreferencesKey("male_voice")
              val voiceHi = stringPreferencesKey("voice_hi")
              val voiceEn = stringPreferencesKey("voice_en")
              val pitch = floatPreferencesKey("pitch")
              val geminiModel = stringPreferencesKey("gemini_model")
          }

          data class Prefs(
              val language: String = "AUTO",
              val speakAloud: Boolean = true,
              val speed: Float = 1.0f,
              val accent: String = "cyan",
              val userName: String = "Ayush",
              val apiKey: String = "",
              val callDirect: Boolean = false,
              val skillAlarms: Boolean = true,
              val skillCalls: Boolean = true,
              val skillApps: Boolean = true,
              val skillMusic: Boolean = true,
              val skillDevice: Boolean = true,
              val skillNotes: Boolean = true,
              val skillWeb: Boolean = true,
              val wakeWord: Boolean = false,
              val maleVoice: Boolean = true,
              val voiceHi: String = "",
              val voiceEn: String = "",
              val pitch: Float = 1.0f,
              val geminiModel: String = ""
          )

          @Serializable
          data class Note(val id: Long, val text: String, val time: Long)

          class PrefsRepo(private val ctx: Context) {

              val prefs: Flow<Prefs> = ctx.jarvisStore.data.map { p ->
                  val d = Prefs()
                  Prefs(
                      language = p[K.language] ?: d.language,
                      speakAloud = p[K.speakAloud] ?: d.speakAloud,
                      speed = p[K.speed] ?: d.speed,
                      accent = p[K.accent] ?: d.accent,
                      userName = p[K.userName] ?: d.userName,
                      apiKey = p[K.apiKey] ?: d.apiKey,
                      callDirect = p[K.callDirect] ?: d.callDirect,
                      skillAlarms = p[K.skillAlarms] ?: d.skillAlarms,
                      skillCalls = p[K.skillCalls] ?: d.skillCalls,
                      skillApps = p[K.skillApps] ?: d.skillApps,
                      skillMusic = p[K.skillMusic] ?: d.skillMusic,
                      skillDevice = p[K.skillDevice] ?: d.skillDevice,
                      skillNotes = p[K.skillNotes] ?: d.skillNotes,
                      skillWeb = p[K.skillWeb] ?: d.skillWeb,
                      wakeWord = p[K.wakeWord] ?: d.wakeWord,
                      maleVoice = p[K.maleVoice] ?: d.maleVoice,
                      voiceHi = p[K.voiceHi] ?: d.voiceHi,
                      voiceEn = p[K.voiceEn] ?: d.voiceEn,
                      pitch = p[K.pitch] ?: d.pitch,
                      geminiModel = p[K.geminiModel] ?: d.geminiModel
                  )
              }

              val notes: Flow<List<Note>> = ctx.jarvisStore.data.map { p -> decode(p[K.notes]) }

              suspend fun <T> set(key: Preferences.Key<T>, value: T) {
                  ctx.jarvisStore.edit { it[key] = value }
              }

              suspend fun addNote(text: String) {
                  ctx.jarvisStore.edit { p ->
                      val now = System.currentTimeMillis()
                      val list = listOf(Note(now, text, now)) + decode(p[K.notes])
                      p[K.notes] = encode(list.take(200))
                  }
              }

              suspend fun deleteNote(id: Long) {
                  ctx.jarvisStore.edit { p ->
                      p[K.notes] = encode(decode(p[K.notes]).filter { it.id != id })
                  }
              }

              private fun decode(json: String?): List<Note> {
                  if (json.isNullOrBlank()) return emptyList()
                  return try {
                      Json.decodeFromString<List<Note>>(json)
                  } catch (e: Exception) {
                      emptyList()
                  }
              }

              private fun encode(list: List<Note>): String = Json.encodeToString(list)
          }
