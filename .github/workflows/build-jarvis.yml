           */
          object Norm {
              fun text(s: String): String {
                  var t = s.lowercase(Locale.ROOT)
                      .replace("़", "")
                      .replace("a.m.", "am").replace("p.m.", "pm")
                      .replace("a.m", "am").replace("p.m", "pm")
                  val sb = StringBuilder()
